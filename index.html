<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAWABARI DEFENSE ─ ナワバリディフェンス</title>
<meta name="description" content="線で囲んで陣地を広げると、広さに応じたタワーが建って侵入者を撃つ。ナワバリ取りとタワーディフェンスの対戦ゲーム。">
<meta property="og:title" content="NAWABARI DEFENSE ─ ナワバリディフェンス">
<meta property="og:description" content="陣地を取るとタワーが建つ、ナワバリ取り × タワーディフェンス。ブラウザだけで遊べます。">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 13 10' shape-rendering='crispEdges'><rect x='2' y='0' width='9' height='7' fill='%23d97757'/><rect x='0' y='3' width='2' height='2' fill='%23d97757'/><rect x='11' y='3' width='2' height='2' fill='%23d97757'/><rect x='3' y='7' width='1' height='2' fill='%23d97757'/><rect x='5' y='7' width='1' height='2' fill='%23d97757'/><rect x='7' y='7' width='1' height='2' fill='%23d97757'/><rect x='9' y='7' width='1' height='2' fill='%23d97757'/><rect x='4' y='1' width='1' height='2' fill='%231d1411'/><rect x='8' y='1' width='1' height='2' fill='%231d1411'/></svg>">
<style>
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(ellipse at 50% 30%, #101528 0%, #05060d 70%);
    overflow:hidden; touch-action:none;
    font-family:'Courier New', monospace;
  }
  #wrap{
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
  }
  #game{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#04050d;
    box-shadow:0 0 40px rgba(60,90,255,.20), 0 0 5px rgba(255,255,255,.16);
  }
  /* 走査線(CRT効果 ON のときだけ) */
  body.crt::after{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  /* ---- タッチ操作パッド(粗ポインタ端末のみ表示) ---- */
  #pad{
    display:none; width:100%; max-width:480px;
    justify-content:space-between; align-items:center;
    padding:4px 16px 14px; box-sizing:border-box;
    user-select:none; -webkit-user-select:none;
  }
  @media (pointer:coarse){ #pad{ display:flex; } }
  /* スマホ横向き: 十字キーを左、ボタンを右に分けて、ゲーム画面を大きく */
  @media (pointer:coarse) and (orientation:landscape){
    #wrap{ flex-direction:row; gap:14px; }
    #pad{ display:contents; }
    #dpad{ order:0; } #game{ order:1; } #acts{ order:2; flex-direction:column; }
  }
  /* アナログスティック: 親指を置いてすべらせる方向に進む */
  #dpad{ display:block; }
  #stick{ position:relative; width:176px; height:176px; border-radius:50%;
    border:1px solid #3a4a7a; background:radial-gradient(circle, rgba(40,52,100,.55) 0%, rgba(20,26,56,.55) 70%);
    touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  #stick .ar{ position:absolute; color:#56608a; font:bold 14px 'Courier New',monospace; pointer-events:none; }
  #knob{ position:absolute; left:50%; top:50%; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, rgba(150,175,255,.85), rgba(70,95,190,.8)); border:1px solid #9fb1ff;
    pointer-events:none; }
  #stick.on{ border-color:#6d7ba8; }
  .pb,.ab{
    border:1px solid #3a4a7a; border-radius:10px;
    background:rgba(30,40,80,.55); color:#cdd8ff;
    font:bold 19px 'Courier New',monospace;
    touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  .pb:active,.ab:active{ background:rgba(90,120,220,.7); }
  .ghost{ visibility:hidden; }
  #acts{ display:flex; gap:14px; }
  .ab{ width:76px; height:76px; border-radius:50%; font-size:14px; line-height:1.2; }
  #b-fast{ border-color:#2e86ab; color:#a8e4ff; }
  #b-view{ border-color:#6a4aa8; color:#d8c4ff; width:60px; height:60px; }
  .ab small{ font-size:10px; opacity:.8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="856"></canvas>
  <div id="pad">
    <div id="dpad">
      <div id="stick">
        <span class="ar" style="left:81px;top:6px">▲</span><span class="ar" style="left:81px;bottom:6px">▼</span>
        <span class="ar" style="left:8px;top:79px">◀</span><span class="ar" style="right:8px;top:79px">▶</span>
        <div id="knob"></div>
      </div>
    </div>
    <div id="acts">
      <button class="ab" id="b-view">全体<br><small>みる</small></button>
      <button class="ab" id="b-fast">FAST<br><small>×1点</small></button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   QLAIM v4 ─ Qix風 陣取りアーケード (単一HTML / 依存なし / WebAudio合成)

   ルール:
   ・線の上から方向キーで空き地へ進むと線を引ける(ゆっくり/×2点)。
     Z を押している間だけ速く引ける(×1点)。線が閉じると QIX のいない側が塗り潰される
   ・目標占領率でエリアクリア。AREA 3 からは QIX が2体になり、
     線で「分断」すると即クリア + SPLITボーナス
   ・QIXが線に触れる / SPARXに触れる / 導火線に追いつかれる → ミス
   ・描画中に立ち止まると導火線に点火。動けば止まり、止まると迫る

   v3 の新要素: 盤面(サーフェス)
   ・平面(PLANE) … 従来どおりの長方形フィールド
   ・立体の「表面」で陣取り … 立方体・球・正多面体・切頂/準正多面体・
     星型多面体・ドーナツ・クラインの壺。
     最初は小さな陣地(HOME)だけがあり、その縁から線を引いて広げる。
     カメラは自機(Clawd)を追いかけて回り込み、方向キーは常に「画面上の向き」
   ・TOUR … 全部の盤面をエリアごとに巡る

   v4.6 SEEKER … AREA 4 から。空き地を動き、線を引いている間は自機を追ってくる。
     描きかけの線に触れるとミス。線で囲んで閉じ込めると倒せる

   v4 の新要素
   ・アイテム … 空き地にときどき出る。線で囲むと手に入る(SLOW/SHIELD/STAR/1UP)
   ・コンボ … 続けて囲むと得点倍率が上がる
   ・裏側ビュー … 立体の見えていない側を右下の小窓に映す
   ・盤面ごとの最高占領率を記録 / 画面をなぞって操作 / ポーズメニュー

   ── カスタマイズ ────────────────────────────
   ・数値バランス      → すぐ下の CONFIG(盤面ごとの値は CONFIG.SURF)
   ・難易度プリセット  → DIFFS
   ・配色テーマ        → THEMES(ゲーム内OPTIONSで切替可)
   ・BGMの譜面         → BGMDATA(音名で書けます。'A2' 'G#4' など)
   ・ゲーム内OPTIONS   → 音量 / 難易度 / 残機 / テーマ / CRT効果
     (設定とハイスコアは localStorage が使える環境なら自動保存。
      使えない環境ではセッション内のみ保持)
===================================================================== */
/* -- 立体面の共通設定(CONFIG.SURF の各盤面で上書きできる) -- */
const SURF3D = { n:30, home:5, target:70, speed:0.55, qixSpeed:0.55, arm:5, pts:3,
                 sparx:0.40, sparxStart:1, sparxWait:4 };
const s3 = o => Object.assign({}, SURF3D, o);

const CONFIG = {
  /* -- 画面・フィールド ---------------------------------------- */
  GRID_W: 128,          // 平面フィールド横セル数
  GRID_H: 160,          // 平面フィールド縦セル数
  CELL: 5,              // 平面の1セルのピクセルサイズ
  HUD_H: 56,            // 上部HUDの高さ(px)

  /* -- 速度(セル/秒) ------------------------------------------ */
  PLAYER_SPEED: 38,     // 線上の移動速度
  DRAW_FAST: 38,        // Zを押しながら描く速さ(×1点)
  DRAW_SLOW: 18,        // 方向キーだけで描く速さ(×2点)

  QIX_SPEED: 14,        // QIX基本速度
  QIX_ACCEL: 1.09,      // エリア毎のQIX速度倍率
  TWO_QIX_FROM: 3,      // このエリア以降 QIX 2体(分断で即クリア)
  QIX_DASH_FROM: 6,     // このエリアから QIX がときどき自機へ突進する(直前に白く光って予告)
  QIX_DASH_RATE: 2.3,   // 突進中の速さ(倍)

  SPARX_SPEED: 24,      // SPARX速度
  SPARX_INTERVAL: 25,   // 追加SPARXの出現間隔(秒)
  SPARX_MAX: 6,         // SPARX最大数


  /* -- ゲーム進行 ---------------------------------------------- */
  LIVES: 3,             // 残機の既定値(OPTIONSで変更可)
  EXTEND_FIRST: 20000,  // 最初の1UPスコア
  EXTEND_EVERY: 50000,  // 以降の1UP間隔
  INVULN: 2.0,          // 復活後の無敵時間(秒)
  CLIMAX_TIME: 10,      // ナワバリバトル: 残りこの秒数で BGM が盛り上がる
  SPLIT_BONUS: 8000,    // QIX分断ボーナス(基本)
  SPLIT_BONUS_LV: 2000, // 分断ボーナスのエリア加算
  BIG_CLAIM: 10,        // 一度にこの%以上囲むと BIG CLAIM ボーナス
  BIG_CLAIM_PTS: 120,   // BIG CLAIM ボーナス(1%あたり)
  NEAR_MISS_PTS: 150,   // QIXが描きかけの線をかすめたときのボーナス
  READY_TIME: 1.4,      // AREA表示(READY)の時間(秒)


  /* -- アイテム・コンボ ---------------------------------------- */
  ITEM_INTERVAL: 11,    // アイテムが出る間隔(秒)
  ITEM_MAX: 2,          // 同時に出ているアイテムの最大数
  ITEM_LIFE: 18,        // アイテムが消えるまで(秒)
  SLOW_TIME: 8,         // SLOW: 敵がゆっくりになる時間(秒)
  SLOW_RATE: 0.4,       // SLOW中の敵の速さ(倍)
  RAINBOW_TIME: 12,     // RAINBOW: 虹色インクの時間(秒)
  OVER_TIME: 8,         // 上塗り: 陣地の上を走って塗れる時間(秒)
  STAR_TIME: 10,        // STAR: 得点2倍の時間(秒)
  VS_TIME: 90,          // ナワバリバトルの制限時間(秒)
  RIVAL_RESPAWN: 2.5,   // CPUがやられてから戻ってくるまで(秒)
  COMBO_TIME: 5,        // この秒数以内に次を囲むとコンボ
  COMBO_STEP: 0.5,      // コンボ1つごとの倍率の上がり幅
  COMBO_MAX: 3,         // コンボ倍率の上限

  /* -- 盤面ごとの設定 ------------------------------------------
     label/sub: 表示名 / shape: 形 / music: AUTO時のBGM
     n: 立体の細かさ(6面×n×n セル) / home: 初期陣地の半径(セル)
     target: クリア占領率(%) / speed: 自機・導火線の速度倍率
     qixSpeed: QIX速度倍率 / arm: QIXの腕の長さ(セル) / pts: 得点倍率
     sparx: SPARX速度倍率 / sparxStart: 開始時のSPARX数 / sparxWait: 開始時のSPARXが動き出すまで(秒) */
  SURF: {
    PLANE:       { label:'平面', sub:'インクのステージ', target:75, speed:1.00, qixSpeed:1.00, arm:11, pts:1,
                   sparx:1.00, sparxStart:2, sparxWait:0, music:'splash' },
    CUBE:        s3({ label:'立方体',       sub:'正多面体',           shape:'cube',        music:'chip' }),
    SPHERE:      s3({ label:'球',           sub:'まんまるの球', shape:'sphere',   music:'earth' }),
    TETRA:       s3({ label:'正四面体',     sub:'正多面体',           shape:'tetra',       music:'battle', target:68 }),
    OCTA:        s3({ label:'正八面体',     sub:'正多面体',           shape:'octa',        music:'neon' }),
    DODECA:      s3({ label:'正12面体',     sub:'正多面体',           shape:'dodeca',      music:'matsuri' }),
    ICOSA:       s3({ label:'正20面体',     sub:'正多面体',           shape:'icosa',       music:'orbit' }),
    TRUNC_TETRA: s3({ label:'切頂四面体',   sub:'切頂正多面体',       shape:'truncTetra',  music:'chip' }),
    TRUNC_CUBE:  s3({ label:'切頂六面体',   sub:'切頂正多面体',       shape:'truncCube',   music:'idm' }),
    TRUNC_ICOSA: s3({ label:'切頂20面体',   sub:'切頂正多面体 = サッカーボール', shape:'truncIcosa', music:'chip' }),
    CUBOCTA:     s3({ label:'立方八面体',   sub:'準正多面体',         shape:'cubocta',     music:'ambient' }),
    ICOSIDODECA: s3({ label:'20・12面体',   sub:'準正多面体',         shape:'icosidodeca', music:'ambient' }),
    RHOMBICUBOCTA: s3({ label:'斜方立方八面体', sub:'準正多面体',     shape:'rhombicubocta', music:'synth' }),
    TRUNC_OCTA:  s3({ label:'切頂八面体',   sub:'切頂正多面体',       shape:'truncOcta',   music:'synth' }),
    TRUNC_DODECA: s3({ label:'切頂12面体',  sub:'切頂正多面体',       shape:'truncDodeca', music:'ambient' }),
    STELLA:      s3({ label:'星型八面体',   sub:'星型 (ケプラーの星)', shape:'stella',     music:'idm', target:65 }),
    SSD:         s3({ label:'小星型12面体', sub:'星型正多面体',       shape:'ssd',         music:'idm', target:65 }),
    GSD:         s3({ label:'大星型12面体', sub:'星型正多面体',       shape:'gsd',         music:'drone', target:65 }),
    TORUS:       s3({ label:'ドーナツ',     sub:'トーラス',           shape:'torus',       music:'lofi', home:4 }),
    MOBIUS:      s3({ label:'メビウスの帯', sub:'縁が1本だけのねじれた帯', shape:'mobius', music:'lofi' }),
    KNOT:        s3({ label:'三葉結び目',   sub:'結び目の形の管',     shape:'trefoil',     music:'idm', home:4 }),
    KLEIN:       s3({ label:'クラインの壺', sub:'表と裏のない曲面',   shape:'klein',       music:'drone', target:65, home:4 }),
  },
  // TOURモードでエリアが巡る順番
  TOUR: ['PLANE', 'CUBE', 'SPHERE', 'TETRA', 'DODECA', 'TRUNC_ICOSA', 'CUBOCTA', 'STELLA', 'TORUS', 'MOBIUS',
         'OCTA', 'ICOSA', 'TRUNC_TETRA', 'TRUNC_CUBE', 'ICOSIDODECA', 'RHOMBICUBOCTA', 'TRUNC_OCTA', 'TRUNC_DODECA',
         'SSD', 'GSD', 'KNOT', 'KLEIN'],
};

/* ---- 難易度プリセット(OPTIONSで選択) ----
   qix/sparx: 速度倍率, interval: SPARX追加間隔倍率, fuse: 導火線猶予倍率 */
const DIFFS = {
  EASY:   { qix: 0.80, sparx: 0.85, interval: 1.5, fuse: 1.5 },
  NORMAL: { qix: 1.00, sparx: 1.00, interval: 1.0, fuse: 1.0 },
  HARD:   { qix: 1.22, sparx: 1.18, interval: 0.7, fuse: 0.7 },
};
const DIFF_KEYS = ['EASY', 'NORMAL', 'HARD'];

/* ---- アイテム(線で囲むと手に入る) ----
   mark: 表示する記号 / col: 色 / w: 出やすさ */
const ITEMS = {
  slow:   { label:'SLOW',   mark:'S', col:'#7df9ff', w:3, txt:'敵がゆっくり' },
  shield: { label:'SHIELD', mark:'◆', col:'#8dff9e', w:3, txt:'1回だけミスを防ぐ' },
  star:   { label:'STAR',   mark:'★', col:'#ffd76b', w:3, txt:'得点2倍' },
  life:   { label:'1UP',    mark:'♥', col:'#ff9ee8', w:1, txt:'残機+1(残機制のときだけ出る)' },
  zap:    { label:'ZAP',    mark:'✦', col:'#ff7a4a', w:2, txt:'バチッコを一掃' },
  over:   { label:'上塗り', mark:'⟳', col:'#ffffff', w:5, txt:'しばらく陣地の上を走って相手の色を上塗り(混ざると中立)' },
};
function pickItemKind() {
  // 上塗りは対戦モードだけ
  const ks = Object.keys(ITEMS).filter(k => (k !== 'over' || hasRivals()) && !(k === 'life' && vsTimeRule())), tot = ks.reduce((a, k) => a + ITEMS[k].w, 0);
  let r = Math.random() * tot;
  for (const k of ks) { r -= ITEMS[k].w; if (r < 0) return k; }
  return ks[0];
}

/* ---- 盤面の豆知識(READY 画面に出す) ---- */
const SURF_INFO = {
  PLANE:'すべての始まり。長方形のフィールド',
  CUBE:'6つの正方形。サイコロの形',
  SPHERE:'まんまるの球。どこから見ても同じ形',
  TETRA:'4つの正三角形。いちばん面の少ない立体',
  OCTA:'8つの正三角形。ピラミッドを2つ合わせた形',
  DODECA:'12の正五角形。古代ギリシャでは宇宙の形とされた',
  ICOSA:'20の正三角形。20面ダイスでおなじみ',
  TRUNC_TETRA:'正四面体の角を切ると六角形が現れる',
  TRUNC_CUBE:'立方体の角を切った形。正八角形と正三角形',
  TRUNC_ICOSA:'正五角形12枚と正六角形20枚。サッカーボール',
  CUBOCTA:'辺の真ん中どうしを結ぶと現れる。正方形6と正三角形8',
  ICOSIDODECA:'正五角形12と正三角形20。正12面体と正20面体のあいだ',
  RHOMBICUBOCTA:'正方形18と正三角形8。ふくらんだ立方体',
  TRUNC_OCTA:'正八面体の角を切った形。すき間なく空間を埋められる',
  TRUNC_DODECA:'正十角形12と正三角形20',
  STELLA:'2つの正四面体が重なった星。ケプラーが名づけた',
  SSD:'正12面体の面をのばすと生まれるトゲの星',
  GSD:'20本の長いトゲ。星型正多面体でいちばんトゲトゲ',
  TORUS:'穴のある曲面。ぐるっと1周の線を引いても2つに分かれない',
  MOBIUS:'ねじれて表と裏がつながった帯。縁は1本だけ',
  KNOT:'結び目の形をした管。切らずにほどくことはできない',
  KLEIN:'4次元なら自分と交わらずに作れる。3次元では首が胴を突き抜ける',
};

/* ---- 遊ぶ盤面(タイトル画面で ←→ で選択) ---- */
const MODES = ['VS'];   // NAWABARI はナワバリバトルだけ(ほかのモード名は中身を削るまで内部に残っている)
function hasRivals() { return isVS(); }
// 途中で決着する占領率: CPU が3人以上なら 90%(ほぼ時間いっぱい遊べる)
function matchTarget() { return isVS() && rivals.length >= 3 ? 90 : target(); }
// VS(ナワバリバトル): 自機と同じことができるCPUと、制限時間内に広い陣地を取ったほうが勝ち
function isVS() { return settings.mode === 'VS'; }

// 日付の文字列 'YYYYMMDD'(ギャラリー・実績の日付、スクショの名前)
function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
}
// 記録(ハイスコア・ランキング)の保存キー
function modeKey() { return settings.mode; }
function modeLabel(m) {
  if (m === 'VS') return 'VS ─ ナワバリバトル';
  return CONFIG.SURF[m].label;
}
function modeSub(m) {
  if (m === 'VS') return '全員敵同士。決定でステージ・ルール・CPUを選ぶ';
  return CONFIG.SURF[m].sub;
}

/* ---- 塗る音(OPTIONS) ---- */
const CLAIM_SND_OPTS = ['MIX', 'CLASSIC', 'ARPEGGIO', 'SHEPARD', 'HARP', 'BELL', 'STAB'];
const CLAIM_SND_KEYS = { CLASSIC:'classic', ARPEGGIO:'arp', SHEPARD:'shepard', HARP:'harp', BELL:'bell', STAB:'stab' };
/* ---- BGMの選び方(OPTIONS)。AUTO は盤面ごとの music ---- */
const MUSIC_KEYS = ['AUTO', 'BATTLE', 'NEON', 'MATSURI', 'SPLASH', 'CLASSIC', 'ORBIT', 'EARTH', 'CHIP', 'DRONE', 'AMBIENT', 'IDM', 'SYNTH', 'LOFI'];

/* ---- BGM 譜面データ ----------------------------------------------
   音名で書けます: 'C4' 'G#3' など(♭は # で書く: B♭ → 'A#')。null は休符。
   t:'n' はメロディトラック { w:波形, v:音量, g:ゲート(音長=g×16分), l:レイヤー }
   t:'kick'/'hat'/'snare' はドラム { p:[鳴らすステップ...], l:レイヤー }
   レイヤー l は「盛り上がり段階」。占領率が上がるほど段階が増え、
   l <= 現在段階 のトラックだけが鳴ります(0=常時)。
   len=ステップ総数(16分音符換算)。bpm はテンポ。
   音色の追加パラメータ(省略可):
     a: 立ち上がり秒(大きいとふわっと) / r: 余韻秒 / det: うなり(セント。2音をずらして重ねる)
     echo: やまびこ回数 / ed: やまびこの間隔(16分いくつ) / pr: 鳴る確率(0〜1。IDM風の気まぐれ)
     oj: 1オクターブ上に跳ねる確率
   ドラムに t:'blip'(ノイズの粒。グリッチ音)もある。at(長さ, {ステップ:'音名'}) は休符だらけの譜面の略記。

   曲の構成(form): セクションを順に演奏して、最後まで行ったら頭に戻る。各セクションは
     n: 繰り返す回数 / t: 移調(半音いくつ上げるか。-2 なら全音下) / alt: 別メロディ s2・別リズム p2 を使う
     mute: 鳴らさないトラック番号(tracks の上から 0,1,2…) / drums:false でドラム全部お休み(ブレイク)
     boost: 盛り上がり段階を足す(+1 でサビ感)
   セクションの変わり目の直前4ステップにはスネアのフィルが自動で入る。
   同じセクションを繰り返すときは、メロディがときどきオクターブ上に跳ねて少しずつ変化する。

   play    … クラシック(平面)   Am → F → G → E
   orbit   … 宇宙っぽい(球など) Dm → B♭ → C → A
   chip    … チップチューン      Em → C → D → B
   drone   … ドローン            D の持続音に A → A# がにじむ
   ambient … アンビエント        Fmaj7 → C/E → Dm9 → B♭maj7
   idm     … IDM(変拍子っぽい崩し) F#m → D → A → E
   synth   … シンセウェイブ      Am → F → C → G(4つ打ち)
   lofi    … ローファイ          Dm7 → G7 → Cmaj7 → Am7(swing: 裏拍を後ろにずらしてハネさせる)
   splash  … ファンク(平面)      Em7 → A7 / Bメロ Cmaj7 → B7(スラップ風ベース・クラビ・ブラス)

   音色の追加(v5): flt:[開始Hz,終わりHz,Q] ベースなどの「ワウッ」, vib:[速さ,深さ] ビブラート,
     pn: 左右(-1〜1), rv: リバーブ量(省略時は長い音ほど深め)。打楽器 ohat / clap / tom(f:高さHz)
-------------------------------------------------------------------- */
function at(len, notes) { const a = new Array(len).fill(null); for (const k in notes) a[k] = notes[k]; return a; }
// アルペジオ: 和音ごとに16ステップ、8分音符で上がって下がる
function arp(chords, pat) {
  pat = pat || [0, null, 1, null, 2, null, 3, null, 2, null, 1, null, 3, null, 2, null];
  return chords.flatMap(ch => pat.map(k => k == null ? null : ch[k]));
}

/* ---------------- 定数・ユーティリティ ---------------- */
// GW・GH・CS はステージの広さで変わる(applyStageSize)。画面の大きさ W・H はいつも同じ
let GW = CONFIG.GRID_W, GH = CONFIG.GRID_H, CS = CONFIG.CELL;
const FIELD_Y = CONFIG.HUD_H;
const W = GW * CS, H = FIELD_Y + GH * CS;
/* ---- ステージの広さ(対戦モード) ----
   平面: マスを細かくして、同じ画面にたくさんのマスを入れる(みんなマス単位で動くので、そのぶん広く感じる)。
   立体: 面のマスの数を増やす。AUTO は人数で決める(4人まで 中 / 7人まで 大 / それより多いと 特大) */
const STAGE_SIZES = {
  S:  { cs: 6.4, n: 0.8,  label: '小' },
  M:  { cs: 5,   n: 1,    label: '中' },
  L:  { cs: 4,   n: 1.25, label: '大' },
  XL: { cs: 3.2, n: 1.5,  label: '特大' },
};
let stageScale = 'M';
function stageSizeLabel(k) { return k === 'AUTO' ? 'AUTO' : (STAGE_SIZES[k] || STAGE_SIZES.M).label; }
function applyStageSize(k) {
  if (!STAGE_SIZES[k]) k = 'M';
  if (k === stageScale) return false;
  stageScale = k;
  CS = STAGE_SIZES[k].cs; GW = Math.round(W / CS); GH = Math.round((H - FIELD_Y) / CS);
  if (typeof fieldC !== 'undefined') { fieldC.width = Math.round(GW * CS); fieldC.height = Math.round(GH * CS); }
  return true;
}
// 見た目の大きさ(マスが細かいときは、キャラも少し小さく)
function sprK() { return clamp(CS / 5, 0.7, 1.15); }
const OPEN = 0, WALL = 1, TRAIL = 2, RTRAIL = 3;   // RTRAIL: CPU(ライバル)の描きかけの線
const HOME_COL = 9;              // colA: 初期陣地(HOME)の色番号
const DIRS4 = [[0,-1],[1,0],[0,1],[-1,0]];
const DIRV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const DIRK = { up:0, right:1, down:2, left:3 };

const idx = (x, y) => y * GW + x;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

// 色: '#rrggbb' ⇔ [r,g,b]
function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbStr(c, k) {
  k = k == null ? 1 : k;
  return `rgb(${clamp(c[0] * k | 0, 0, 255)},${clamp(c[1] * k | 0, 0, 255)},${clamp(c[2] * k | 0, 0, 255)})`;
}
function mixRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function hslHex(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function hexOf(c) { return '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
// '#rrggbb' を明度倍率で暗く(占領地のディザ用)
function shade(hex, k) { return rgbStr(rgbOf(hex), k); }
// 音名 → 周波数('A4'=440)
function hz(name) {
  const m = /^([A-G])(#?)(-?\d)$/.exec(name);
  if (!m) return 440;
  const base = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]] + (m[2] ? 1 : 0);
  const midi = 12 * (Number(m[3]) + 1) + base;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// 3Dベクトル([x,y,z] 配列)
const vdot   = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vadd   = (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
function vnorm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

   ・nb8[c*8+m] … 斜めを含む近傍(境界判定用、-1=なし)
   ・pos[c*3..] … セル中心の座標(平面は x,y / 立体はワールド座標)

    for (let k = 0; k < 4; k++) { const a = nb[c * 4 + k]; if (a >= 0) { own.push(a); nb8[c * 8 + m++] = a; } }
    cnt.clear();
    for (const a of own) for (let k = 0; k < 4; k++) {
      const b = nb[a * 4 + k];
      if (b < 0 || b === c || own.includes(b)) continue;
      cnt.set(b, (cnt.get(b) || 0) + 1);
    }
    for (const [b, n] of cnt) if (n >= 2 && m < 8) nb8[c * 8 + m++] = b;
  }

}

/* ---- 平面 ---- */
function blockedCell(fx, fy) {
  const cx = Math.floor(fx), cy = Math.floor(fy);
  if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return true;
  return grid[idx(cx, cy)] !== OPEN;

  const N = GW * GH;
  const nb = new Int32Array(N * 4).fill(-1);
  const pos = new Float32Array(N * 3);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const c = idx(x, y);
    pos[c * 3] = x; pos[c * 3 + 1] = y;

    key: 'PLANE', def: CONFIG.SURF.PLANE, is3D: false, N, nb, nb8: buildNb8(N, nb), pos,
    // 外周を壁にする。戻り値: 自機の出発セル / SPARXの出現セル
    setup() {
      for (let x = 0; x < GW; x++) { grid[idx(x, 0)] = WALL; grid[idx(x, GH - 1)] = WALL; }

  stella:      () => { const T = scalePts(POLY.tetra(), 1); return [hullPlanes(T), hullPlanes(T.map(v => v.map(x => -x)))]; },
  ssd:         () => stellate(POLY.dodeca(), 0.5628),  // 小星型12面体: 芯は正12面体
  gsd:         () => stellate(POLY.icosa(), 0.4195),   // 大星型12面体: 芯は正20面体
};
// 方向 u(単位ベクトル)に進んだとき表面までの距離。nOut に面の法線を入れる。pieces=null は球
function radialOf(pieces, u, nOut) {
  let best = 0, bn = null;
  if (pieces) for (const P of pieces) {
    let lo = 0, hi = Infinity, hn = null;
    for (const q of P) {
      const nu = q.n[0] * u[0] + q.n[1] * u[1] + q.n[2] * u[2];
      if (nu > 1e-12) { const t = q.d / nu; if (t < hi) { hi = t; hn = q.n; } }
      else if (nu < -1e-12) { const t = q.d / nu; if (t > lo) lo = t; }
      else if (q.d < 0) { hi = -1; break; }
    }
    if (hn && hi >= lo && hi > best) { best = hi; bn = hn; }
  }
  if (!bn) { nOut[0] = u[0]; nOut[1] = u[1]; nOut[2] = u[2]; return pieces ? 0.3 : 1; }
  nOut[0] = bn[0]; nOut[1] = bn[1]; nOut[2] = bn[2];
  return best;
}

/* ---- 立体面(キューブスフィア割り付け) ----
   球面を立方体の6面に見立てて n×n に区切ったものがセル。そのセルを
   上の「形」の表面へ中心から放射状に貼る。どの形でもつながり方(グラフ)は同じ。
   各面は [法線N, 面内の軸U, 面内の軸V] (U×V=N)。 */
const CUBE_FACES = [
  [[0,0,1],  [1,0,0],  [0,1,0]],   // 0 手前(+Z)  ← 初期陣地はこの面の中央
  [[0,0,-1], [-1,0,0], [0,1,0]],   // 1 奥
  [[1,0,0],  [0,0,-1], [0,1,0]],   // 2 右
  [[-1,0,0], [0,0,1],  [0,1,0]],   // 3 左
  [[0,1,0],  [1,0,0],  [0,0,-1]],  // 4 上
  [[0,-1,0], [1,0,0],  [0,0,1]],   // 5 下
];

// 方向ベクトル → [面, u, v](u,v は面上の -1..1)
function cubeFaceUV(x, y, z) {
  const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
  if (az >= ax && az >= ay) return z > 0 ? [0, x / az, y / az] : [1, -x / az, y / az];
  if (ax >= ay)             return x > 0 ? [2, -z / ax, y / ax] : [3, z / ax, y / ax];
  return y > 0 ? [4, x / ay, -z / ay] : [5, x / ay, z / ay];
}

function makeRadialSurface(key, sc) {
  const def = Object.assign({}, CONFIG.SURF[key]);
  def.n = Math.max(8, Math.round(def.n * (sc || 1)));
  const gno = def.shape === 'cube';     // 立方体だけは面ごとに等間隔、ほかは等角(セルの大きさが揃う)
  const pieces = def.shape === 'sphere' ? null : SHAPES[def.shape]();
  const n = def.n, nn = n * n, N = 6 * nn, VN = n + 1, nv = 6 * VN * VN;
  const QA = Math.PI / 4;
  const warp   = t => gno ? t : Math.tan(t * QA);
  const unwarp = u => gno ? u : Math.atan(u) / QA;
  const cellIJ = (f, a, b) => f * nn + clamp(Math.floor((b + 1) * 0.5 * n), 0, n - 1) * n
                                     + clamp(Math.floor((a + 1) * 0.5 * n), 0, n - 1);
  function cellAt(x, y, z) {
    const r = cubeFaceUV(x, y, z);
    return cellIJ(r[0], unwarp(r[1]), unwarp(r[2]));
  }
  const nrm = [0, 0, 0];
  // 方向 d の先の表面上の点(ついでに nrm に法線)
  function place(d) {
    const u = vnorm(d), r = radialOf(pieces, u, nrm);
    return [u[0] * r, u[1] * r, u[2] * r];
  }
  const facePt = (F, u, v) => [F[0][0] + F[1][0] * u + F[2][0] * v,
                               F[0][1] + F[1][1] * u + F[2][1] * v,
                               F[0][2] + F[1][2] * u + F[2][2] * v];

  const dir = new Float32Array(N * 3), pos = new Float32Array(N * 3), nor = new Float32Array(N * 3);
  const nc = new Float32Array(N), par = new Uint8Array(N);
  const nb = new Int32Array(N * 4), quad = new Int32Array(N * 4);
  const vpos = new Float32Array(nv * 3);
  const OFS = [[0,-1],[1,0],[0,1],[-1,0]];   // k=0..3: -v, +u, +v, -u
  for (let f = 0; f < 6; f++) {
    const F = CUBE_FACES[f];
    for (let b = 0; b <= n; b++) for (let a = 0; a <= n; a++) {
      const q = place(facePt(F, warp(a / n * 2 - 1), warp(b / n * 2 - 1)));
      const v = f * VN * VN + b * VN + a;
      vpos[v * 3] = q[0]; vpos[v * 3 + 1] = q[1]; vpos[v * 3 + 2] = q[2];
    }
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const c = f * nn + j * n + i;
      const ta = (i + 0.5) / n * 2 - 1, tb = (j + 0.5) / n * 2 - 1;
      const d = facePt(F, warp(ta), warp(tb));
      const dn = vnorm(d), q = place(d), no = nrm.slice();
      for (let e = 0; e < 3; e++) { dir[c * 3 + e] = dn[e]; pos[c * 3 + e] = q[e]; nor[c * 3 + e] = no[e]; }
      nc[c] = vdot(no, q);
      par[c] = (i + j) & 1;
      const v0 = f * VN * VN + j * VN + i;
      quad[c * 4] = v0; quad[c * 4 + 1] = v0 + 1; quad[c * 4 + 2] = v0 + VN + 1; quad[c * 4 + 3] = v0 + VN;
      // つながり: 等間隔座標で1セル先の点がどのセルか(面の外に出れば隣の面のセルになる)
      for (let k = 0; k < 4; k++) {
        const r = cubeFaceUV(...facePt(F, ta + OFS[k][0] * 2 / n, tb + OFS[k][1] * 2 / n));
        nb[c * 4 + k] = cellIJ(r[0], r[1], r[2]);
      }
    }
  }
  const cellAng = (Math.PI / 2) / n;       // 1セルぶんの角度(ラジアン)
  return {
    key, def, is3D: true, sph: !pieces, sorted: !!pieces && pieces.length > 1, twoSided: false, translucent: false,
    n, N, nb, nb8: buildNb8(N, nb), pos, dir, nor, nc, par, quad, vpos, nv,
    cellAt,
    ptCell: p => cellAt(p[0], p[1], p[2]),
    world: p => place(p),                    // QIXの方向ベクトル → 表面上の点
    // 初期陣地(HOME): 手前の面の中央 (2h)×(2h) マス。縁だけ線の色にする
    setup() {
      const h = def.home, lo = (n >> 1) - h, hi = (n >> 1) + h - 1;
      for (let j = lo; j <= hi; j++) for (let i = lo; i <= hi; i++) {
        const c = j * n + i;
        grid[c] = WALL;
        colA[c] = (i === lo || i === hi || j === lo || j === hi) ? 0 : HOME_COL;
      }
      return { start: lo * n + (n >> 1), home: hi * n + (n >> 1) };
    },
    screenOf(c) { return projXYZ(pos[c * 3] * 1.01, pos[c * 3 + 1] * 1.01, pos[c * 3 + 2] * 1.01); },
    // QIXは陣地の反対側(奥)から出る
    qixSpawn(k, nq) {
      const a = nq === 1 ? 0 : (k ? 0.7 : -0.7);
      const p = vnorm([Math.sin(a), 0.15 * (k ? 1 : -1) * (nq - 1), -Math.cos(a)]);
      return { p, h: rotAround(vnorm(vcross(p, [0, 1, 0])), p, rand(0, Math.PI * 2)) };
    },
    qixCell(q) { return cellAt(q.p[0], q.p[1], q.p[2]); },
    qixTurn(q, a) { q.h = rotAround(q.h, q.p, a); },
    qixAim(q, c) {   // 目標の方向を接平面に落とした向き
      const t = [dir[c * 3], dir[c * 3 + 1], dir[c * 3 + 2]], h = vadd(t, q.p, -vdot(t, q.p));
      if (Math.hypot(h[0], h[1], h[2]) > 1e-6) q.h = vnorm(h);
    },
    qixMove(q, dist) {
      let rem = dist * cellAng;
      const smax = 0.4 * cellAng;
      while (rem > 0) {
        const a = Math.min(smax, rem);
        rem -= a;
        const np = vnorm(vadd(q.p, q.h, a));
        if (grid[cellAt(np[0], np[1], np[2])] !== OPEN) {
          q.h = rotAround(q.h, q.p, Math.PI + rand(-0.9, 0.9)); // 跳ね返り
          continue;
        }
        q.h = vnorm(vadd(q.h, np, -vdot(q.h, np)));            // 進行方向を新しい位置の接平面へ
        q.p = np;
      }
    },
    qixArm(q, a, L) {
      const d = vadd(vadd([0,0,0], q.h, Math.cos(a)), vcross(q.p, q.h), Math.sin(a));
      const pts = [];
      const M = Math.max(80, Math.ceil(L * 16));   // 細かく(立方体の角の小さいマスでも、角をかすめてもすり抜けない)
      for (let m = 0; m <= M; m++) pts.push(vnorm(vadd(q.p, d, (2 * m / M - 1) * L * cellAng)));
      return { pts };
    },
    segEach(sg, fn) {
      for (const q of sg.pts) if (fn(cellAt(q[0], q[1], q[2]))) return true;
      return false;
    },
    qixScreen(q) { const w = place(q.p); return projXYZ(w[0], w[1], w[2]); },
  };
}
// 接ベクトル h を軸 p(単位・h⊥p)まわりに角度 a 回す
function rotAround(h, p, a) {
  const c = Math.cos(a), s = Math.sin(a), x = vcross(p, h);
  return vnorm([h[0] * c + x[0] * s, h[1] * c + x[1] * s, h[2] * c + x[2] * s]);
}

/* ---- 曲面(ドーナツ・クラインの壺) ----
   (u,v) の長方形を NU×NV に区切り、端どうしを貼り合わせて閉じた曲面にする。
   ドーナツ: 上下・左右をそのまま貼る。
   クラインの壺: 左右を貼るとき上下が反転する(u=π の縁 (π,v) が u=0 の縁 (0,π−v) につながる)。
   表と裏の区別がないので、両面を描き、半透明にして中も透かす。 */
function kleinBottle(u, v) {
  const cu = Math.cos(u), su = Math.sin(u), cv = Math.cos(v), sv = Math.sin(v);
  const c2 = cu * cu, c3 = c2 * cu, c4 = c2 * c2, c5 = c4 * cu, c6 = c4 * c2, c7 = c6 * cu;
  return [
    -2 / 15 * cu * (3 * cv - 30 * su + 90 * c4 * su - 60 * c6 * su + 5 * cu * cv * su),
    -1 / 15 * su * (3 * cv - 3 * c2 * cv - 48 * c4 * cv + 48 * c6 * cv - 60 * su + 5 * cu * cv * su
                    - 5 * c3 * cv * su - 80 * c5 * cv * su + 80 * c7 * cv * su),
    2 / 15 * (3 + 5 * cu * su) * sv,
  ];
}
// 三葉結び目の管: 結び目の曲線 c(t) のまわりに半径 r の管をかぶせる(向きはフレネ標構)
function trefoilTube(u, v) {
  const c = t => [Math.sin(t) + 2 * Math.sin(2 * t), Math.cos(t) - 2 * Math.cos(2 * t), -Math.sin(3 * t)];
  const e = 1e-3, p = c(u), a = c(u - e), b = c(u + e);
  const T = vnorm(vadd(b, a, -1));
  const acc = [a[0] + b[0] - 2 * p[0], a[1] + b[1] - 2 * p[1], a[2] + b[2] - 2 * p[2]];
  const Nn = vnorm(vadd(acc, T, -vdot(acc, T))), B = vcross(T, Nn), r = 0.5;
  const cv = Math.cos(v) * r, sv = Math.sin(v) * r;
  return [p[0] + cv * Nn[0] + sv * B[0], p[1] + cv * Nn[1] + sv * B[1], p[2] + cv * Nn[2] + sv * B[2]];
}
/* PARAM_SHAPES の項目:
   NU,NV: 格子の数 / uMax: u の範囲 / vRange: v の範囲(省略時 0..2π)
   flip: u の端をまたぐと v が反転 / flipOff: 反転のしかた(y → flipOff − y)
   border: v の端は貼らずに「縁」にする(メビウスの帯) */
const PARAM_SHAPES = {
  mobius: { NU: 120, NV: 22, flip: true, flipOff: 22, border: true, uMax: Math.PI * 2, vRange: [-1, 1], f(u, v) {
    const r = 1 + v / 2 * Math.cos(u / 2), x = r * Math.cos(u), y = r * Math.sin(u), z = v / 2 * Math.sin(u / 2), a = 1.0;
    return [x, y * Math.cos(a) - z * Math.sin(a), y * Math.sin(a) + z * Math.cos(a)];
  } },
  trefoil: { NU: 180, NV: 22, flip: false, uMax: Math.PI * 2, f: trefoilTube },
  torus: { NU: 108, NV: 40, flip: false, uMax: Math.PI * 2, f(u, v) {
    const r = 1 + 0.45 * Math.cos(v), y = 0.45 * Math.sin(v), z = r * Math.sin(u), a = 0.6; // 少し傾ける
    return [r * Math.cos(u), y * Math.cos(a) - z * Math.sin(a), y * Math.sin(a) + z * Math.cos(a)];
  } },
  // camSquash: カメラが自機を追う向きの横成分を縮める(クラインの壺は横から見ると形が分かりやすい)
  klein: { NU: 120, NV: 44, flip: true, flipOff: 22, uMax: Math.PI, f: kleinBottle, camSquash: 0.35 },
};

function makeParamSurface(key, sc) {
  const def = CONFIG.SURF[key], PS = PARAM_SHAPES[def.shape];
  sc = sc || 1;
  // 広さに合わせてマスを増やす(裏返りのつなぎ flipOff も同じ割合で。偶数にそろえる)
  const NU = 2 * Math.round(PS.NU * sc / 2), NV = 2 * Math.round(PS.NV * sc / 2), N = NU * NV, flip = PS.flip, nv = (NU + 1) * (NV + 1);
  const FO = PS.flipOff ? Math.round(PS.flipOff * NV / PS.NV) : PS.flipOff, border = !!PS.border, VR = PS.vRange || [0, Math.PI * 2];
  const raw0 = (x, y) => PS.f(x / NU * PS.uMax, VR[0] + y / NV * (VR[1] - VR[0]));
  // 中心を原点に、いちばん遠い点が半径1になるようにそろえる
  const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  for (let y = 0; y <= NV; y += 0.5) for (let x = 0; x <= NU; x += 0.5) {
    const q = raw0(x, y);
    for (let e = 0; e < 3; e++) { mn[e] = Math.min(mn[e], q[e]); mx[e] = Math.max(mx[e], q[e]); }
  }
  const C = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
  let RR = 0;
  for (let y = 0; y <= NV; y += 0.5) for (let x = 0; x <= NU; x += 0.5) RR = Math.max(RR, vdist(raw0(x, y), C));
  const raw = (x, y) => { const q = raw0(x, y); return [(q[0] - C[0]) / RR, (q[1] - C[1]) / RR, (q[2] - C[2]) / RR]; };
  // 端をまたいだ座標・セル番号の貼り合わせ
  function wrapXY(x, y) {
    if (x >= NU || x < 0) { const k = Math.floor(x / NU); x -= k * NU; if (flip && (k & 1)) y = FO - y; }
    return [x, border ? clamp(y, 0, NV - 1e-6) : ((y % NV) + NV) % NV];
  }
  // セル番号。縁(border)の外は -1
  function cellIdx(i, j) {
    if (i >= NU || i < 0) { const k = Math.floor(i / NU); i -= k * NU; if (flip && (k & 1)) j = FO - 1 - j; }
    if (border) return j < 0 || j >= NV ? -1 : j * NU + i;
    return (((j % NV) + NV) % NV) * NU + i;
  }
  const cellAtP = (x, y) => {
    const w = wrapXY(x, y);
    return Math.min(NV - 1, Math.floor(w[1])) * NU + Math.min(NU - 1, Math.floor(w[0]));
  };

  const dir = new Float32Array(N * 3), pos = new Float32Array(N * 3), nor = new Float32Array(N * 3);
  const nc = new Float32Array(N), par = new Uint8Array(N), area = new Float32Array(N);
  const nb = new Int32Array(N * 4), quad = new Int32Array(N * 4), vpos = new Float32Array(nv * 3);
  for (let b = 0; b <= NV; b++) for (let a = 0; a <= NU; a++) {
    const q = raw(a, b), v = b * (NU + 1) + a;
    vpos[v * 3] = q[0]; vpos[v * 3 + 1] = q[1]; vpos[v * 3 + 2] = q[2];
  }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) {
    const c = j * NU + i, q = raw(i + 0.5, j + 0.5);
    const cr = vcross(vadd(raw(i + 1, j + 0.5), raw(i, j + 0.5), -1), vadd(raw(i + 0.5, j + 1), raw(i + 0.5, j), -1));
    area[c] = Math.hypot(cr[0], cr[1], cr[2]);
    const sq = PS.camSquash || 1, cq = [q[0] * sq, q[1] * sq, q[2]];
    const dn = Math.hypot(cq[0], cq[1], cq[2]) > 1e-6 ? vnorm(cq) : [0, 0, 1];
    const no = area[c] > 1e-12 ? vnorm(cr) : dn;
    for (let e = 0; e < 3; e++) { dir[c * 3 + e] = dn[e]; pos[c * 3 + e] = q[e]; nor[c * 3 + e] = no[e]; }
    nc[c] = vdot(no, q);
    par[c] = (i + j) & 1;
    const v0 = j * (NU + 1) + i;
    quad[c * 4] = v0; quad[c * 4 + 1] = v0 + 1; quad[c * 4 + 2] = v0 + NU + 2; quad[c * 4 + 3] = v0 + NU + 1;
    nb[c * 4] = cellIdx(i, j - 1); nb[c * 4 + 1] = cellIdx(i + 1, j);
    nb[c * 4 + 2] = cellIdx(i, j + 1); nb[c * 4 + 3] = cellIdx(i - 1, j);
  }
  // HOME: いちばん大きいセルのあたり(クラインの壺は貼り合わせの縁をまたがない位置)
  const h = def.home;
  let hc = 0;
  for (let c = 1; c < N; c++) if (area[c] > area[hc]) hc = c;
  let hi0 = hc % NU;
  const hj0 = (hc / NU) | 0;
  if (flip) hi0 = clamp(hi0, h + 1, NU - h - 2);
  if (border) hi0 = NU >> 2;
  return {
    key, def, is3D: true, sph: false, sorted: true, twoSided: true, translucent: true, border,
    NU, NV, N, nb, nb8: buildNb8(N, nb), pos, dir, nor, nc, par, quad, vpos, nv,
    cellAtP, cellIdx,
    ptCell: q => cellAtP(q[0], q[1]),
    world: q => raw(q[0], q[1]),
    setup() {
      if (border) {   // 縁のある曲面: 縁(上下の列)が最初の線。自機は上の縁から
        for (let i = 0; i < NU; i++) { grid[i] = WALL; grid[(NV - 1) * NU + i] = WALL; }
        return { start: cellIdx(hi0, NV - 1), home: cellIdx(hi0 + (NU >> 1), 0) };
      }
      for (let dj = -h; dj < h; dj++) for (let di = -h; di < h; di++) {
        const c = cellIdx(hi0 + di, hj0 + dj);
        grid[c] = WALL;
        colA[c] = (di === -h || di === h - 1 || dj === -h || dj === h - 1) ? 0 : HOME_COL;
      }
      return { start: cellIdx(hi0, hj0 - h), home: cellIdx(hi0, hj0 + h - 1) };
    },
    screenOf(c) { return projXYZ(pos[c * 3], pos[c * 3 + 1], pos[c * 3 + 2]); },
    qixSpawn(k, nq) {
      const w = wrapXY(hi0 + NU / 2 + (nq > 1 ? (k ? 6 : -6) : 0), border ? NV / 2 : hj0 + NV / 2);
      return { x: w[0], y: w[1], head: rand(0, Math.PI * 2) };
    },
    qixCell: q => cellAtP(q.x, q.y),
    qixTurn(q, a) { q.head += a; },
    qixAim(q, c) {   // 近いほうへ回り込む(貼り合わせは無視した近似)
      let dx = (c % NU) + 0.5 - q.x, dy = ((c / NU) | 0) + 0.5 - q.y;
      if (dx > NU / 2) dx -= NU; else if (dx < -NU / 2) dx += NU;
      if (!border) { if (dy > NV / 2) dy -= NV; else if (dy < -NV / 2) dy += NV; }
      q.head = Math.atan2(dy, dx);
    },
    qixMove(q, dist) {
      while (dist > 0) {
        const step = Math.min(0.4, dist);
        dist -= step;
        const nx = q.x + Math.cos(q.head) * step, ny = q.y + Math.sin(q.head) * step;
        const crossed = flip && (nx >= NU || nx < 0);
        const w = wrapXY(nx, ny);
        if (grid[cellAtP(w[0], w[1])] !== OPEN) { q.head += Math.PI + rand(-0.9, 0.9); continue; }
        q.x = w[0]; q.y = w[1];
        if (crossed) q.head = -q.head;   // 裏返って出てくる
      }
    },
    qixArm(q, a, L) {
      const pts = [];
      const M = Math.max(80, Math.ceil(L * 16));   // 細かく(立方体の角の小さいマスでも、角をかすめてもすり抜けない)

  claimAt = new Float32Array(surf.N).fill(-1e9);
  ringA = new Uint8Array(surf.N);
  waveUntil = 0; rings = [];
  items = []; itemTimer = CONFIG.ITEM_INTERVAL * 0.6;
  slowT = 0; starT = 0; combo = 0; comboT = 0; guarded = false; areaTime = 0;
  ink.rainbowT = 0; nextInk();
  areaMiss = 0; areaFast = false;
  if (state !== 'title') {
    stats.plays[surf.key] = (stats.plays[surf.key] || 0) + 1;
    if (!(stats.maxRound >= lv)) stats.maxRound = lv;   // 最高ラウンド
  }
  const s = surf.setup();
  setupRivals(lv);
  homeCell = s.home;
  initOpen = 0;
  for (let i = 0; i < surf.N; i++) if (grid[i] === OPEN) initOpen++;
  claimed = 0;

  player.c = s.start; player.prev = -1; player.lastDir = null;
  player.acc = 0; player.drawing = false; player.usedFast = false; player.invuln = 0; player.pts = []; player.overT = 0;
  player.fx = null; syncPos(player);
  trail = []; trailStart = -1;
  if (surf.is3D) {
    camSnap([surf.dir[player.c * 3], surf.dir[player.c * 3 + 1], surf.dir[player.c * 3 + 2]]);
    if (state !== 'title') cam.D = 9;   // ワープ: 遠くから飛び込んでくる(updateCamera が 3.4 へ寄せる)
  }

  const spd = CONFIG.QIX_SPEED * diff().qix * Math.pow(CONFIG.QIX_ACCEL, lv - 1) * surf.def.qixSpeed;
  qixes = [];
  const nq = !numerinOn() ? 0 : lv >= CONFIG.TWO_QIX_FROM && !hasRivals() ? 2 : 1;
  for (let k = 0; k < nq; k++) qixes.push(makeQix(k, nq, spd));
  if (surf.is3D && hasRivals()) {                     // 立体の対戦: 基地を作ってから空き地を数え直す
    setupRivals3D(lv);
    initOpen = 0; for (let i = 0; i < surf.N; i++) if (grid[i] === OPEN) initOpen++;
  }

  sparxes = [];
  const ns = !bachikkoOn() ? 0 : Math.min(4, surf.def.sparxStart + ((lv - 1) >> 1));
  for (let i = 0; i < ns; i++) spawnSparx(i % 2 ? 1 : -1, surf.def.sparxWait + i * 1.5 * (surf.def.sparxWait > 0));
  sparxTimer = CONFIG.SPARX_INTERVAL * diff().interval;
  if (!bachikkoOn()) sparxTimer = Infinity;
  // 最初からある壁(外枠・HOME)
  baseA = new Uint8Array(surf.N);
  for (let i = 0; i < surf.N; i++) if (grid[i] === WALL) baseA[i] = 1;
  recountAreas();

  towers = []; shots = []; player.hp = FIGHTER_HP; player.hurtT = 9;
  particles = []; floats = []; fxBanner = null; zoomPunch = null; fwQueue = []; slowMoT = 0;
  if (isVS()) lapseReset();                         // タイムラプスの最初の盤面
  deathTimer = 0; wasSplit = false; shakeT = 0;
  if (autoTheme) applyTheme();   // AUTO: 盤面が変わったら配色(と背景)も
  redrawField();
}

// 平面: 占領済みレイヤーをオフスクリーンへ焼き込む(市松ディザで質感を出す)
function redrawField() {
  if (surf.is3D) return; // 立体面は毎フレーム描く
  const t = theme();
  // 床: うっすらタイル目地
  fctx.fillStyle = t.field;
  fctx.fillRect(0, 0, fieldC.width, fieldC.height);
  fctx.strokeStyle = 'rgba(255,255,255,0.035)'; fctx.lineWidth = 1;
  fctx.beginPath();
  for (let x = 0; x <= fieldC.width; x += 32) { fctx.moveTo(x + 0.5, 0); fctx.lineTo(x + 0.5, fieldC.height); }
  for (let y = 0; y <= fieldC.height; y += 32) { fctx.moveTo(0, y + 0.5); fctx.lineTo(fieldC.width, y + 0.5); }
  fctx.stroke();
  // 陣地: セルごとに少し大きめの円を重ねる → ふちが丸くインクっぽくなる。色ごとにまとめて塗る
  const paths = {}, add = (key, x, y, r) => { (paths[key] = paths[key] || new Path2D()).moveTo(x + r, y); paths[key].arc(x, y, r, 0, Math.PI * 2); };
  const gloss = new Path2D(), dim = new Path2D(), lit = new Path2D(), ownedL = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const i = idx(x, y);
    if (grid[i] !== WALL) continue;
    const c = colA[i], cx = x * CS + CS / 2, cy = y * CS + CS / 2;
    if (!c && lineOwnerHex(i)) { ownedL.push(i); continue; }   // ネオンの帯であとで描く
    if (!c || c === HOME_COL) {
      const lh = c ? null : lineHex(i, x, y);
      if (!lh) add('line', cx, cy, CS * 0.55);
      else add('L' + lh, cx, cy, isBoundary(i) ? CS * 0.55 : CS * 0.98);
    }
    else {
      add((ringA[i] ? 'd' : 'n') + c + (mixA[i] ? ':' + col2A[i] + ':' + mixA[i] : ''), cx, cy, CS * 0.98);
      // インクのムラ(濃いしみ・薄いしみ)と、つやの点
      const hsh = (i * 2654435761) >>> 0;
      if (hsh % 41 === 0) { dim.moveTo(cx + CS * 2.4, cy); dim.arc(cx, cy, CS * 2.4, 0, Math.PI * 2); }
      else if (hsh % 59 === 0) { lit.moveTo(cx + CS * 1.8, cy); lit.arc(cx, cy, CS * 1.8, 0, Math.PI * 2); }
      if (hsh % 173 === 0) { gloss.moveTo(cx + 1.6, cy - 1); gloss.arc(cx, cy - 1, 1.6, 0, Math.PI * 2); }
    }
  }
  for (const key in paths) {
    if (key === 'line') continue;
    if (key[0] === 'L') { fctx.fillStyle = key.slice(1); fctx.fill(paths[key]); continue; }
    const [c, b, m] = key.slice(1).split(':').map(Number), hx = cellHex(c, b || 0, m || 0);
    fctx.fillStyle = key[0] === 'd' ? shade(hx, 0.9) : hx;
    fctx.fill(paths[key]);
  }
  // ムラは陣地の上だけに(陣地の形で切り抜く)
  fctx.save();
  const clip = new Path2D();
  for (const key in paths) if (key !== 'line' && key[0] !== 'L') clip.addPath(paths[key]);
  fctx.clip(clip);
  fctx.fillStyle = 'rgba(0,0,0,0.10)'; fctx.fill(dim);
  fctx.fillStyle = 'rgba(255,255,255,0.07)'; fctx.fill(lit);
  { // つや: 左上ほど明るく、右下ほど少し沈む(塗りに立体感)
    const g = fctx.createLinearGradient(0, 0, fieldC.width, fieldC.height);
    g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(0.45, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,0.14)');
    fctx.fillStyle = g; fctx.fillRect(0, 0, fieldC.width, fieldC.height);
  }
  fctx.restore();
  fctx.fillStyle = 'rgba(255,255,255,0.35)'; fctx.fill(gloss);
  if (paths.line) { fctx.fillStyle = t.line; fctx.fill(paths.line); }
  // ネオン: できあがった線も、描いていたときと同じ帯(チームの色 + 真ん中の白い芯)のまま
  drawOwnedLines(fctx, ownedL, c => ({ x: (c % GW) * CS + CS / 2, y: ((c / GW) | 0) * CS + CS / 2 }), CS * 1.35);
}

// クリア時: 残った空き地を薄く塗って「封鎖」感を出す(判定には影響しない。立体面は描画側で処理)
function sealRemaining() {
  if (surf.is3D) return;
  const c = shade(theme().accent, 0.28);
  fctx.fillStyle = c;
  for (let y = 0; y < GH; y++)
    for (let x = 0; x < GW; x++)
      if (grid[idx(x, y)] === OPEN) fctx.fillRect(x * CS, y * CS, CS, CS);
}

// 囲んだときに「塗らずに残す側」の空き地のマス: いちばん広い空き地(= 狭いほうを塗る)。
// ナワバリバトルはふつうこれ(ヌメリンを閉じこめても、一度に塗れるのは狭いほうだけ)。
// 設定「塗れる側」が「ヌメリンのいない側」(fillRule = 'QIX')なら、ひとり用と同じくヌメリンのいる側を残す
function keepCell() {
  if (qixes.length && (!isVS() || fillByQix())) return openNear(surf.qixCell(qixes[0]));
  const N = surf.N, nb = surf.nb, seen = new Uint8Array(N), q = new Int32Array(N);
  let best = -1, bestN = 0;
  for (let s0 = 0; s0 < N; s0++) {
    if (seen[s0] || grid[s0] !== OPEN) continue;
    let h = 0, t = 0; q[t++] = s0; seen[s0] = 1;
    while (h < t) { const c = q[h++]; for (let k = 0; k < 4; k++) { const j = nb[c * 4 + k]; if (j >= 0 && !seen[j] && grid[j] === OPEN) { seen[j] = 1; q[t++] = j; } } }
    if (t > bestN) { bestN = t; best = s0; }
  }
  return best;
}
// 塗られた側に閉じこめられたヌメリンは、残った広い空き地のいちばん奥へ移る
function rescueQixes() {
  if (!qixes.length) return;
  let deep = -1;
  for (const q of qixes) {
    const c = surf.qixCell(q);
    if (c >= 0 && grid[c] === OPEN && visitedFrom(keepCell())[c]) continue;
    if (deep < 0) {
      const keep = visitedFrom(keepCell()), walls = [];
      for (let i = 0; i < surf.N; i++) if (!keep[i]) walls.push(i);
      if (walls.length === surf.N) return;                // 空き地がない(試合の終わり)
      const d = bfsDist(walls);
      deep = -1; let best = -1;
      for (let i = 0; i < surf.N; i++) if (keep[i] && d[i] > best) { best = d[i]; deep = i; }
      if (deep < 0) return;
    }
    qixPlaceAt(q, deep);
    const p = surf.screenOf(deep);
    rings.push({ x: p.x, y: p.y, t: 0, col: qixStroke(q.hue, 62, 1) });
    floats.push({ x: p.x, y: p.y - 20, txt: 'ヌメリン にげた!', t: 1.4, col: '#9fe3ff' });
  }
}
// ヌメリンをマス c に移す(盤面の種類ごとの位置の持ち方に合わせる)
function qixPlaceAt(q, c) {
  if (q.p) {                                             // 多面体・球: 方向ベクトル p と接ベクトル h
    q.p = vnorm([surf.dir[c * 3], surf.dir[c * 3 + 1], surf.dir[c * 3 + 2]]);
    const t = Math.abs(q.p[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    q.h = vnorm(vcross(q.p, t));
  } else if (surf.NU) { q.x = (c % surf.NU) + 0.5; q.y = ((c / surf.NU) | 0) + 0.5; }   // 曲面
  else { q.x = (c % GW) + 0.5; q.y = ((c / GW) | 0) + 0.5; }                            // 平面
  q.segs = []; q.segT = 0; q.dash = 0;
}
// 塗れる側: 'SMALL' = 狭いほう / 'QIX' = ヌメリンのいない側(ヌメリンを閉じこめれば広いほうも取れる)。ヌメリンがいるときだけ効く
function fillByQix() { return settings.fillRule === 'QIX' && settings.numerin !== 'OFF'; }
const FILL_LABEL = { SMALL: '狭いほう', QIX: 'ヌメリンのいない側' };
const TARGET_LABEL = { FIGHTERS: 'ファイターだけ', ALL: 'ファイター+じゃま役' };
// ナワバリバトルの邪魔役: 対戦の設定で ON / OFF(タイトルの背景にはいつも出す)
function numerinOn() { return !hasRivals() || state === 'title' || settings.numerin !== 'OFF'; }
function bachikkoOn() { return !hasRivals() || settings.bachikko !== 'OFF'; }

// startIdx を含む連結空き地を訪問済みにして返す
function visitedFrom(startIdx) {
  const N = surf.N, nb = surf.nb;
  const visited = new Uint8Array(N);
  if (startIdx < 0 || grid[startIdx] !== OPEN) return visited;
  const q = new Int32Array(N);
  let h = 0, t = 0;
  q[t++] = startIdx; visited[startIdx] = 1;
  while (h < t) {
    const i = q[h++];
    for (let k = 0; k < 4; k++) {
      const j = nb[i * 4 + k];
      if (j >= 0 && !visited[j] && (grid[j] === OPEN || grid[j] === TRAIL || grid[j] === RTRAIL)) { visited[j] = 1; q[t++] = j; }
    }
  }
  return visited;
}

// c が空き地ならそのまま、違えば近くの空き地セルを探す(QIXが線の上に乗った場合の安全策)
function openNear(c) {
  if (grid[c] === OPEN) return c;
  const N = surf.N, nb = surf.nb, seen = new Uint8Array(N);
  let cur = [c]; seen[c] = 1;
  for (let r = 0; r < 12 && cur.length; r++) {
    const nx = [];
    for (const a of cur) for (let k = 0; k < 4; k++) {
      const b = nb[a * 4 + k];
      if (b < 0 || seen[b]) continue;
      if (grid[b] === OPEN) return b;
      seen[b] = 1; nx.push(b);
    }
    cur = nx;
  }
  for (let i = 0; i < N; i++) if (grid[i] === OPEN) return i; // 最終安全策(全部塗り事故の防止)
  return -1;
}

// 占領したセルに「波が届く時刻」を付ける(閉じた場所から遠いほど遅い)
function markClaim(i) {
  const P = surf.pos, a = waveFrom * 3, b = i * 3;
  const d = Math.hypot(P[a] - P[b], P[a + 1] - P[b + 1], P[a + 2] - P[b + 2]);
  const t = blinkT + d * (surf.is3D ? 0.45 : 0.006);
  claimAt[i] = t;
  ringA[i] = Math.floor(d * (surf.is3D ? 9 : 0.28)) & 1;      // 同心円の縞
  if (t + 0.35 > waveUntil) waveUntil = t + 0.35;
}

// QIX(先頭)のいる連結領域を残し、それ以外の空き地を占領する
function claimFill(palNo) {
  const visited = visitedFrom(keepCell());
  let gained = 0;
  for (let i = 0; i < surf.N; i++) {
    if (grid[i] === OPEN && !visited[i]) { grid[i] = WALL; colA[i] = colFor(i, palNo); mixA[i] = 0; ownA[i] = 1; newCells.push(i); markClaim(i); gained++; }
  }
  return gained;
}

// 占領後などに、プレイヤーが線上(境界)から外れていたら最寄りの境界へ寄せる
function snapPlayerToBoundary() {
  if (isBoundary(player.c)) return;
  const nb = surf.nb, visited = new Uint8Array(surf.N);
  const q = [player.c];
  visited[player.c] = 1;
  for (let h = 0; h < q.length; h++) {
    const c = q[h];
    if (isBoundary(c)) { player.c = c; player.prev = -1; return; }
    for (let k = 0; k < 4; k++) {
      const j = nb[c * 4 + k];
      if (j >= 0 && !visited[j] && grid[j] === WALL) { visited[j] = 1; q.push(j); }
    }
  }
}

/* ---------------- 自由移動(平面) ----------------
   平面では、位置をマス単位の小数(fx, fy)で持ち、入力の向きにそのまま進む(斜めもなめらか)。
   陣地の判定はマスのままなので、斜めに進むときは先に越える側のマスを経由して、線が上下左右につながるようにする。
   壁にぶつかったら軸ごとにすべる。自機もCPUも同じ仕組み(freeMove)で動く */
let stickVec = null;             // スティックのアナログの向き(平面ではこれで自由に動く)
function inputVec() {
  if (stickVec) return stickVec;
  {                                                 // キーコンフィグのキーでも動ける
    const m = PLAY_KEYS, on = a => a.some(c => codesDown.has(c));
    const x = (on(m.r) ? 1 : 0) - (on(m.l) ? 1 : 0), y = (on(m.d) ? 1 : 0) - (on(m.u) ? 1 : 0);
    if (x || y) { const hx = (held.right ? 1 : 0) - (held.left ? 1 : 0), hy = (held.down ? 1 : 0) - (held.up ? 1 : 0);
      const X = clamp(x + hx, -1, 1), Y = clamp(y + hy, -1, 1), l = Math.hypot(X, Y) || 1; return [X / l, Y / l]; }
  }
  const x = (held.right ? 1 : 0) - (held.left ? 1 : 0), y = (held.down ? 1 : 0) - (held.up ? 1 : 0);
  if (!x && !y) return null;
  const l = Math.hypot(x, y);
  return [x / l, y / l];
}
// マスが変わっていたら、位置をそのマスの中心に合わせる(マス単位で動かされたとき用)
function syncPos(a) {
  if (surf.is3D) return;                             // 立体はマスごと(連続した位置は使わない)
  const x = a.c % GW, y = (a.c / GW) | 0;
  if (a.fx == null || Math.floor(a.fx) !== x || Math.floor(a.fy) !== y) { a.fx = x + 0.5; a.fy = y + 0.5; }
}
function tryMoveTo(a, tx, ty, stepFn) {
  const cx = a.c % GW, cy = (a.c / GW) | 0, nx = Math.floor(tx), ny = Math.floor(ty);
  if (nx === cx && ny === cy) { a.fx = tx; a.fy = ty; return true; }
  const dx = nx - cx, dy = ny - cy;
  if (Math.abs(dx) + Math.abs(dy) === 1) {
    if (!stepFn(idx(nx, ny))) return false;
    if (a.c === idx(nx, ny)) { a.fx = tx; a.fy = ty; } else syncPos(a);
    return true;
  }
  if (Math.abs(dx) > 1 || Math.abs(dy) > 1) return false;
  // 斜め: 先に越える軸の側のマスを経由する
  const tX = dx > 0 ? (cx + 1 - a.fx) / Math.max(1e-6, tx - a.fx) : (a.fx - cx) / Math.max(1e-6, a.fx - tx);
  const tY = dy > 0 ? (cy + 1 - a.fy) / Math.max(1e-6, ty - a.fy) : (a.fy - cy) / Math.max(1e-6, a.fy - ty);
  const mids = tX <= tY ? [[nx, cy], [cx, ny]] : [[cx, ny], [nx, cy]];
  for (const [mx, my] of mids) {
    if (!stepFn(idx(mx, my))) continue;
    if (a.c !== idx(mx, my)) { syncPos(a); return true; }        // 途中で線が閉じた・止まった
    a.fx = clamp(tx, mx + 0.01, mx + 0.99); a.fy = clamp(ty, my + 0.01, my + 0.99);
    if (stepFn(idx(nx, ny)) && a.c === idx(nx, ny)) { a.fx = tx; a.fy = ty; } else syncPos(a);
    return true;
  }
  // 線の上を歩いているときだけ、斜めの境界へ直接移れる(描いている線は必ず上下左右でつなぐ)
  if (!a.drawing && grid[idx(nx, ny)] === WALL && isBoundary(idx(nx, ny)) && stepFn(idx(nx, ny))) { syncPos(a); a.fx = tx; a.fy = ty; return true; }
  return false;
}
// a を向き v へ dist マス進める。stepFn(n) はマスに入れるかを決めて入る関数。進めたら true
function freeMove(a, v, dist, stepFn, stop) {
  syncPos(a);
  let moved = false, left = dist;
  while (left > 1e-6) {
    const st = Math.min(0.34, left); left -= st;
    const tx = clamp(a.fx + v[0] * st, 0.01, GW - 0.01), ty = clamp(a.fy + v[1] * st, 0.01, GH - 0.01);
    let ok = tryMoveTo(a, tx, ty, stepFn);
    // ぶつかったら軸ごとにすべる
    if (!ok && Math.abs(v[0]) > 0.15) ok = tryMoveTo(a, clamp(a.fx + Math.sign(v[0]) * st * 0.9, 0.01, GW - 0.01), a.fy, stepFn);
    if (!ok && Math.abs(v[1]) > 0.15) ok = tryMoveTo(a, a.fx, clamp(a.fy + Math.sign(v[1]) * st * 0.9, 0.01, GH - 0.01), stepFn);
    if (!ok) break;
    moved = true;
    if (stop && stop()) break;
  }
  return moved;
}
function freeMovePlayer(dt) {
  if (player.overT > 0) {
    player.overT -= dt;
    if (!player.drawing && overPaintAt(player, 1, 0) > 0) unlock('over');
    if (player.overT <= 0 && !player.drawing && !isBoundary(player.c)) { snapPlayerToBoundary(); player.fx = null; }
  }
  const v = inputVec();
  syncPos(player);
  if (!v) return false;
  const spd = (player.drawing ? (held.fast ? CONFIG.DRAW_FAST : CONFIG.DRAW_SLOW) : CONFIG.PLAYER_SPEED) * surf.def.speed;
  player.vx = v[0]; player.vy = v[1];
  if (v[0] < -0.3) player.look = -1; else if (v[0] > 0.3) player.look = 1;
  const was = player.drawing, x0 = player.fx, y0 = player.fy, c0 = player.c;
  const moved = freeMove(player, v, spd * dt, n => {
    const ok = playerStep(n);
    if (ok) player.moveT = blinkT;
    return ok;
  }, () => state !== 'play' || deathTimer > 0);
  if (!was && player.drawing) player.pts = [[(c0 % GW) + 0.5, ((c0 / GW) | 0) + 0.5]];
  if (player.drawing) {
    const lp = player.pts[player.pts.length - 1];
    if (!lp || Math.hypot(player.fx - lp[0], player.fy - lp[1]) > 0.7) player.pts.push([player.fx, player.fy]);
  } else player.pts = [];
  if (moved) player.moveT = blinkT;
  return moved || (x0 !== player.fx || y0 !== player.fy);
}
// 平面での画面上の位置(連続)
function playerScreen() {
  if (surf.is3D) return surf.screenOf(player.c);
  syncPos(player);
  return { x: player.fx * CS, y: FIELD_Y + player.fy * CS };
}

/* ---------------- プレイヤー ---------------- */
function canEnter(n) {
  if (n < 0) return false;
  const v = grid[n];
  if (player.drawing) return v !== TRAIL;
  return (v === WALL && isBoundary(n)) || v === OPEN;
}

// 押された方向 d(画面上の上下左右)に進む先のセルを選ぶ。なければ -1
function chooseMove(d) {
  const c = player.c, nb = surf.nb;
  if (!surf.is3D) return nb[c * 4 + DIRK[d]];
  // 立体面: 隣の4セルを画面に投影して、押した向きに一番近いものを選ぶ
  const [wx, wy] = DIRV[d], p0 = surf.screenOf(c), dots = [-2, -2, -2, -2];
  for (let k = 0; k < 4; k++) {
    const n = nb[c * 4 + k];
    if (n < 0) continue;
    const p = surf.screenOf(n), dx = p.x - p0.x, dy = p.y - p0.y;
    dots[k] = (dx * wx + dy * wy) / (Math.hypot(dx, dy) || 1);
  }
  // 同じキーを押し続けているなら、面の継ぎ目で画面上の向きがずれても直進を続ける
  if (player.lastDir === d && player.prev >= 0) {
    const kp = nbIndex(c, player.prev);
    if (kp >= 0) {
      const ks = (kp + 2) & 3, n = nb[c * 4 + ks];
      if (dots[ks] > 0.2 && canEnter(n)) return n;
    }
  }
  let best = -1, bd = 0.4;
  for (let k = 0; k < 4; k++) if (dots[k] > bd && canEnter(nb[c * 4 + k])) { bd = dots[k]; best = nb[c * 4 + k]; }
  if (best >= 0 || player.drawing) return best;
  // 線の上: 曲がった境界でもキーを押しっぱなしで線沿いに進めるようにする
  bd = 0.15;
  for (let k = 0; k < 4; k++) {
    const n = nb[c * 4 + k];
    if (n !== player.prev && dots[k] > bd && canEnter(n)) { bd = dots[k]; best = n; }
  }
  return best;
}

function playerMove(d) {
  if (!playerStep(chooseMove(d))) return false;
  player.lastDir = d;
  player.moveT = blinkT;
  if (d === 'left') player.look = -1; else if (d === 'right') player.look = 1;
  return true;
}

function playerStep(n) {
  if (n < 0) return false;
  if (grid[n] === RTRAIL) { const r = rivals.find(q => q.trail.includes(n)); if (r) rivalFail(r, 'cut'); }
  const v = grid[n];

  if (!player.drawing) {
    if (player.overT > 0 && canOverWalk(n) && !isBoundary(n)) { player.prev = player.c; player.c = n; return true; }
    if (v === WALL && isBoundary(n)) { player.prev = player.c; player.c = n; return true; }
    if (v === OPEN) {
      // 描画開始
      player.drawing = true;
      player.usedFast = false;
      player.drawT = blinkT;
      trailStart = player.c;
      trail = [];
      Snd.startDraw(!held.fast);
      enterTrail(n);
      return true;
    }
    return false;
  } else {
    if (v === OPEN)  { enterTrail(n); return true; }
    if (v === WALL)  { player.prev = player.c; player.c = n; closeTrail(); return true; }
    return false; // 自分の軌跡には入れない
  }
}

function enterTrail(n) {
  grid[n] = TRAIL;
  trail.push(n);
  player.prev = player.c; player.c = n;
  if (held.fast) { player.usedFast = true; areaFast = true; }
  Snd.updateDraw(trail.length, !player.usedFast);
  // インクのしずく: ローラーからはねる
  if (trail.length % 2 === 0) {
    const p = surf.screenOf(n), col = trailHex(player.usedFast);
    particles.push({ x: p.x, y: p.y, vx: rand(-40, 40), vy: rand(-60, -20), t: rand(0.35, 0.6), col, ink: true, r: rand(1.8, 3.2) });
  }
}

function closeTrail() {
  Snd.stopDraw();
  const slow = !player.usedFast;
  const inkCol = trailHex(!slow);
  const mul = (slow ? 2 : 1) * surf.def.pts;
  const palNo = inkNo((slow ? 4 : 0) + 1 + ((Math.random() * 4) | 0)); // 1..4=FAST色, 5..8=SLOW色 / INK はインク色

  // 軌跡を壁化(線のセルも空き地から奪った領域として計上する)
  waveFrom = player.c;
  for (const c of trail) { grid[c] = WALL; colA[c] = 0; mixA[c] = 0; ownA[c] = 1; claimAt[c] = blinkT; }
  newCells = [];

  // ---- QIX分断チェック(2体時): 別領域に分かれたら即クリア ----
  if (qixes.length > 1) {
    const seen = visitedFrom(keepCell());
    const crushed = qixes.filter((q, i) => i > 0 && !seen[openNear(surf.qixCell(q))]);
    if (crushed.length) {
      let gained = trail.length;
      for (let i = 0; i < surf.N; i++) {
        if (grid[i] === OPEN && !seen[i]) { grid[i] = WALL; colA[i] = colFor(i, palNo); mixA[i] = 0; ownA[i] = 1; markClaim(i); gained++; }
      }
      claimed += gained;
      score += gained * mul;
      collectItems();
      for (const q of crushed) {
        const sp = surf.qixScreen(q);
        spawnParticles(sp.x, sp.y, 42, theme().accent);
        qixes.splice(qixes.indexOf(q), 1);
      }
      floats.push({ x: W / 2, y: H * 0.4, txt: 'ヌメリン まっぷたつ!!', t: 2.0, col: theme().accent, big: true });
      trail = [];
      player.drawing = false;
      redrawField();
      snapPlayerToBoundary();
      shakeT = 0.4;
      Snd.split();
      buzz(150, 0.8);
      startClear(true);
      return;
    }
  }

  const gained = claimFill(palNo) + trail.length;
  claimed += gained;
  if (hasRivals()) { trapRivals(); recountAreas(); rescueQixes(); }
  // 模様: 塗ったときの状況(時間・面積・アイテム・コンボ)で決まる
  const pat = pickPattern({ drawTime: blinkT - (player.drawT || blinkT), pct: gained / initOpen * 100 });
  lastPat = pat;
  if (isVS()) {                                        // ナワバリバトル: コンボか大きく囲むと柄(色はチームのまま)
    claimFx(newCells.concat(trail), teamHex(0), true);
    buildTowerFor(newCells, 1, 0);
    const tp = claimPattern(newCells, combo, player.c);
    noteWagara(tp);
    if (tp) { const P0 = playerScreen(); floats.push({ x: P0.x, y: P0.y - 40, txt: TEAM_PATS[tp], t: 1.4, col: teamHex(0) }); }
  }
  if (!inkRainbow() && !isVS()) {     // ナワバリバトルは、どっちの陣地か分かるよう無地
    applyPattern(newCells, pat);
    if (pat !== 'grad' && newCells.length > 30) {
      const P0 = surf.screenOf(player.c);
      floats.push({ x: P0.x, y: P0.y - 40, txt: PATTERNS[pat].name + '!', t: 1.4, col: inkHex() });
    }
  }
  newCells = [];
  nextInk();                     // 次の線は別の色

  collectItems();
  if (gained > 0) { stats.claims++; stats.cells += gained; }
  if (gained > 0) {
    // コンボ: 前に囲んでから COMBO_TIME 秒以内なら倍率アップ
    combo = comboT > 0 ? combo + 1 : 0;
    comboT = CONFIG.COMBO_TIME;
    const cm = Math.min(CONFIG.COMBO_MAX, 1 + combo * CONFIG.COMBO_STEP) * (starT > 0 ? 2 : 1) * (ink.rainbowT > 0 ? 1.5 : 1);
    let pts = Math.round(gained * mul * cm);
    if (combo > 0) sayLine('combo');
    else if (gained / initOpen * 100 < CONFIG.BIG_CLAIM && Math.random() < 0.35) sayLine('claimS', 1.2);
    if (combo > 0) floats.push({ x: W / 2, y: H * 0.36, txt: 'COMBO ×' + Math.min(CONFIG.COMBO_MAX, 1 + combo * CONFIG.COMBO_STEP), t: 1.3, col: '#ffd76b', big: true });
    // 一度に大きく囲んだらボーナス
    const gp = gained / initOpen * 100;
    let bonus = 0;
    if (gp >= 20) unlock('big20');
    if (1 + combo * CONFIG.COMBO_STEP >= CONFIG.COMBO_MAX) unlock('combo');
    if (gp >= CONFIG.BIG_CLAIM) {
      bonus = Math.round(gp * CONFIG.BIG_CLAIM_PTS);
      floats.push({ x: W / 2, y: H * 0.45, txt: 'BIG CLAIM +' + bonus, t: 1.6, col: '#8dff9e', big: true });
      sayLine('claimB', 1.6, true);
      buzz(60, 0.5);
      Snd.big();
    }
    score += pts + bonus;
    checkExtend();
    const sp = surf.screenOf(player.c);
    floats.push({
      x: sp.x, y: sp.y,
      txt: '+' + pts + (slow ? ' x2' : ''), t: 1.2,
      col: inkCol,
    });
    for (let i = 0; i < trail.length; i += surf.is3D ? 3 : 6) {
      const p = surf.screenOf(trail[i]);
      spawnParticles(p.x, p.y, 2, inkCol);
    }
    Snd.claim(gained * (surf.is3D ? 4 : 1), slow, lastPat);
    Snd.sweep();
    rings.push({ x: sp.x, y: sp.y, t: 0, col: inkCol });
  }

  trail = [];
  player.drawing = false;
  redrawField();
  snapPlayerToBoundary();

  if (percent() >= matchTarget()) { if (isVS()) vsEnd(); else startClear(false); }
}

const TOPICAL_KINDS = ['start', 'idle', 'clear'];
let lastLine = '';
function pickLine(kind, vars, rnd) {
  const r = rnd != null ? rnd : Math.random();
  let pool = CLAWD_LINES[kind] || [kind], rare = false;
  if (r < 0.04) { pool = RARE_LINES; rare = true; }
  else if (TOPICAL_KINDS.includes(kind) && r < 0.22) { const t = dateLines(new Date()); if (t.length) pool = t; }
  let t = pick(pool);
  if (t === lastLine && pool.length > 1) t = pick(pool.filter(x => x !== lastLine));
  lastLine = t;
  for (const k in (vars || {})) t = t.split('{' + k + '}').join(vars[k]);
  return { txt: t, rare };
}
function sayLine(kind, dur, force, vars) {
  const L = pickLine(kind, vars);
  if (!say(L.txt, dur || 1.6, force)) return false;
  speech.rare = L.rare;
  return true;
}

}

/* ---------------- Clawd のひとこと(吹き出し) ---------------- */
const speech = { txt: '', t: 0, cool: 0 };
// force=false のときは連発しないよう1.5秒あける
function say(txt, dur, force) {
  if (!force && speech.cool > 0) return false;
  speech.txt = txt; speech.t = dur || 1.4; speech.cool = 1.5; speech.rare = false;
  return true;
}
function updateSpeech(dt) {
  if (speech.t > 0) speech.t -= dt;
  if (speech.cool > 0) speech.cool -= dt;
}
function drawSpeech(x, y) {
  if (speech.t <= 0 || !speech.txt) return;
  drawBubble(x, y, (speech.rare ? '★ ' : '') + speech.txt, Math.min(1, speech.t * 4), speech.rare ? '#ffcc33' : null);
}
// 吹き出し: (x, y) の上に。border を渡すとふち色つき。長い文は2行に分ける
function drawBubble(x, y, txt, alpha, border) {
  ctx.font = "bold 13px 'Courier New', monospace";
  txt = tr(txt);
  let lines = [txt];
  if (ctx.measureText(txt).width > 250) {
    let cut = JA_RE.test(txt) ? Math.max(txt.lastIndexOf('。', 16), txt.lastIndexOf('、', 16)) : txt.lastIndexOf(' ', Math.ceil(txt.length / 2) + 4);
    if (cut < 4) cut = Math.ceil(txt.length / 2) - 1;
    lines = [txt.slice(0, cut + 1).trim(), txt.slice(cut + 1).trim()];
  }
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 16, h = 8 + lines.length * 16;
  const bx = clamp(x - w / 2, 6, W - w - 6), by = Math.max(FIELD_Y + 4, y - 28 - h);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.rect(bx, by, w, h); ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, w - 2, h - 2); }
  ctx.beginPath(); ctx.moveTo(x - 5, by + h); ctx.lineTo(x + 5, by + h); ctx.lineTo(x, by + h + 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1d1411';
  ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, by + 16 + i * 16));
  ctx.globalAlpha = 1;
}

/* ---------------- アイテム ---------------- */
function enemySlow() { return slowT > 0 ? CONFIG.SLOW_RATE : 1; }
function spawnItem() {
  for (let tries = 0; tries < 60; tries++) {
    const c = (Math.random() * surf.N) | 0;
    if (grid[c] !== OPEN || items.some(it => it.c === c)) continue;
    if (qixes.some(q => surf.qixCell(q) === c)) continue;
    const k = pickItemKind();
    items.push({ c, k, t: 0 });
    Snd.itemPop();
    if (k === 'over') { const p = surf.screenOf(c); floats.push({ x: p.x, y: p.y - 30, txt: '上塗りアイテム!', t: 1.8, col: '#ffffff', big: true }); rings.push({ x: p.x, y: p.y, t: 0, col: '#ffffff' }); }
    return true;
  }
  return false;
}
function updateItems(dt) {
  if (slowT > 0) slowT -= dt;
  if (starT > 0) { starT -= dt; if (starT <= 0) buildColors(); }
  if (ink.rainbowT > 0) { ink.rainbowT -= dt; if (ink.rainbowT <= 0) buildColors(); }
  if (surf.is3D && inkRainbow() && player.drawing && (ink.rt += dt) > 0.15) { ink.rt = 0; buildColors(); }
  if (nearMissT > 0) nearMissT -= dt;
  // 待機・長い線・ピンチのひとこと
  if (player.drawing) { if (!player.saidLong && trail.length >= (surf.is3D ? 28 : 70)) { player.saidLong = true; sayLine('longline', 1.6); } }
  else player.saidLong = false;
  if (!player.drawing && blinkT - player.moveT > 7 && speech.cool <= 0 && Math.random() < dt * 0.25) sayLine('idle', 2.0);
  if (lives === 0 && !vsTimeRule() && speech.cool <= 0 && Math.random() < dt * 0.04) sayLine('lowlife', 1.6);
  if (comboT > 0) comboT -= dt;
  itemTimer -= dt;
  if (itemTimer <= 0) {
    itemTimer = CONFIG.ITEM_INTERVAL;
    if (items.length < CONFIG.ITEM_MAX) spawnItem();
  }
  for (const it of items) it.t += dt;
  items = items.filter(it => it.t < CONFIG.ITEM_LIFE);
}
// 囲まれて空き地でなくなったアイテムを手に入れる
function collectItems() {
  for (const it of items.filter(it => grid[it.c] !== OPEN)) {
    items.splice(items.indexOf(it), 1);
    const I = ITEMS[it.k], p = surf.screenOf(it.c);
    if (it.k === 'slow') slowT = CONFIG.SLOW_TIME;
    else if (it.k === 'shield') player.shield = true;
    else if (it.k === 'star') { starT = CONFIG.STAR_TIME; buildColors(); }
    else if (it.k === 'over') { player.overT = CONFIG.OVER_TIME; say('上塗りだ!', 1.4, true); }
    else if (it.k === 'life') lives++;
    else if (it.k === 'zap') zapAll();
    itemsGot[it.k] = 1; store.set('qlaim.items', itemsGot);
    stats.items++;
    if (Object.keys(ITEMS).every(k => itemsGot[k])) unlock('items');
    floats.push({ x: p.x, y: p.y - 14, txt: I.label + '!  ' + I.txt, t: 1.8, col: I.col, big: true });
    spawnParticles(p.x, p.y, 26, I.col);
    rings.push({ x: p.x, y: p.y, t: 0.3, col: I.col });
    Snd.item(it.k);
    if (it.k === 'life') say('いのちふえた!', 1.4, true); else if (it.k === 'shield') say('まもりOK!', 1.4, true); else sayLine('item', 1.4, true);
  }
}

function checkExtend() {
  while (score >= nextExtend) {

/* ---------------- QIX ---------------- */
function updateQix(q, dt) {

    }
  }
  if (!(q.dash > 0)) surf.qixTurn(q, (Math.random() - 0.5) * 4 * dt);
  surf.qixMove(q, q.spd * dt * enemySlow() * rate);
  q.arm += 3.4 * dt;
  q.hue = (q.hue + 12 * dt) % 360;     // 色はゆっくり移ろうだけ(チカチカさせない)
  q.segT -= dt;

  let close = false, hit = false;
  // 腕: いまの位置と、ひとつ前の位置(速く回る腕が線をすり抜けないように)
  for (const sg of q.segs.slice(-2)) {
    hit = surf.segEach(sg, c => {

// ニアミスボーナス(2秒に1回まで)

function nearMiss() {

// ヌメリンの体の範囲(中心からグラフで r 歩以内。見た目の体の大きさに合わせる)に線があるか

/* ---------------- 上塗り ----------------
   アイテム「上塗り」を取ると、しばらく陣地の上も走れて、通ったところを塗る。
   相手の陣地 → 2色が混ざって中立(だれのものでもない) / 中立 → 自分の陣地 / 線(境界)と最初からある壁は塗らない */
function fighterOver(r, it) {
  r.overT = CONFIG.OVER_TIME;
  rivalSay(r, 'over');
  const p = surf.screenOf(it.c);
  floats.push({ x: p.x, y: p.y - 14, txt: r.name + ' 上塗り!', t: 1.6, col: teamHex(r.team), big: true });
  Snd.item('over');
}
function overPaintAt(a, own, team) {
  if (!surf.is3D) return overPaint(a.fx, a.fy, own, team);
  const d = bfsNear(a.c, 2);
  return overPaintCells(d, own, team);
}
function bfsNear(c0, rad) {
  const out = [c0], seen = new Set(out);
  for (let h = 0, lv = 0; lv < rad; lv++) { const end = out.length; for (; h < end; h++) for (let k = 0; k < 4; k++) { const n = surf.nb[out[h] * 4 + k]; if (n >= 0 && !seen.has(n)) { seen.add(n); out.push(n); } } }
  return out;
}
function overPaint(fx, fy, own, team) {
  const cells = [];
  const x0 = Math.floor(fx), y0 = Math.floor(fy);
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    if (dx * dx + dy * dy > 4.5) continue;
    const x = x0 + dx, y = y0 + dy;
    if (x < 0 || y < 0 || x >= GW || y >= GH) continue;
    cells.push(idx(x, y));
  }
  return overPaintCells(cells, own, team);
}
function overPaintCells(cells, own, team) {
  let n = 0;
  for (const c of cells) {
    if (grid[c] !== WALL || baseA[c] || colA[c] === 0 || colA[c] === HOME_COL) continue;
    if (towers.length && towerCoreGuard(c, own, team)) continue;       // 敵のタワーの足もと: 塗らずに乗っ取りを進める
    const o = ownA[c];
    if (o === own) continue;
    if (o === OWN_NEUTRAL) {                                                                       // 中立 → 自分の陣地
      if (blinkT - neutralAt[c] < 1.2) continue;       // 中立になったばかりのところは、1.2秒たってから(一度通っただけで自分の色にならない)
      ownA[c] = own; colA[c] = teamNo(team); mixA[c] = 0; n++;
    }
    else { const et = ownerTeam(o); if (et === team) { ownA[c] = own; colA[c] = teamNo(team); n++; continue; }
           ownA[c] = OWN_NEUTRAL; colA[c] = neutralNo(Math.max(0, et), team); mixA[c] = 0; neutralAt[c] = blinkT; n++; }   // 相手 → 中立
  }
  if (n) { fieldDirty = true; recountAreas(); }
  return n;
}
// 上塗り中は、陣地(壁)の上も歩ける。自機は playerStep、ファイターは rivalStep からよぶ
let neutralAt = new Float32Array(0);
function canOverWalk(n) { return grid[n] === WALL && !baseA[n]; }

/* ---------------- キーコンフィグで変えられるキー ----------------
   矢印キー・Z / SPACE はいつでも使える。これは追加のキー(初期値は WASD + 左Shift / Q) */
const PLAY_KEYS = { u: ['KeyW'], d: ['KeyS'], l: ['KeyA'], r: ['KeyD'], f: ['ShiftLeft', 'KeyQ'] };
// キーコンフィグ: 元のキーを覚えておき、保存してあれば読み込む
const DEFAULT_KEYS = JSON.parse(JSON.stringify(PLAY_KEYS));
{ const sv = store.get('qlaim.keys', null); if (sv && typeof sv === 'object') for (const a of ['u', 'd', 'l', 'r', 'f']) if (Array.isArray(sv[a]) && sv[a].length) PLAY_KEYS[a] = sv[a]; }
const codesDown = new Set();                         // いま押されているキー(e.code)
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('keydown', e => { if (e.code) codesDown.add(e.code); });
  window.addEventListener('keyup', e => { if (e.code) codesDown.delete(e.code); });
  window.addEventListener('blur', () => codesDown.clear());
}

/* ---------------- CPU(ライバル) ----------------
   自機と同じことができる相手。線の上を歩き、空き地へ自由に線を引いて、自分の色で陣地を取る。
   自機の描きかけの線を狙って切りにくる。CPUの線に自機が触れる/ヌメリン・バチッコに当たる/陣地で囲まれると、
   CPUはやられて少しあとに戻ってくる(ボンバーマンのように) */
const RIVAL_COLS = [8, 5];               // (昔の名残。ファイターの色は teamHex(r.team))
// VS の CPU の名前: チームの色の名前
const RIVAL_NAMES = ['アカ', 'キイロ', 'アオ', 'ミドリ', 'ムラサキ', 'オレンジ', 'ピンク', 'ミズイロ'];
// VS の CPU の数: 3人から、2ラウンドごとに1人ずつ増えて7人まで(全員敵同士)
function vsCpuCount(lv) {
  if (settings.vsCpu !== 'AUTO' && settings.vsCpu != null) return clamp(+settings.vsCpu | 0, 1, 7);
  return Math.min(7, 3 + Math.floor((lv - 1) / 2));
}
const RIVAL_LINES = {

function lapseShares(sn) {

/* ---------------- パーティクル・フロート文字 ---------------- */
function spawnParticles(px, py, n, col) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(25, 120);
    particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: rand(0.3, 0.9), col });
  }
}
// クリア中は花火を打ち上げる
let fwT = 0;
function updateFireworks(dt) {
  if (state !== 'clear') return;
  fwT -= dt;
  if (fwT > 0) return;
  fwT = rand(0.18, 0.4);
  const x = rand(80, W - 80), y = rand(FIELD_Y + 60, H * 0.55), col = hslHex(rand(0, 360), 90, 65);
  for (let i = 0; i < 34; i++) {
    const a = i / 34 * Math.PI * 2, sp = rand(70, 150);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: rand(0.7, 1.2), col });
  }
  Snd.fuseCr();
}
function updateParticles(dt) {
  updateFireworks(dt);
  updateSpeech(dt);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < 1.0);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 50 * dt; p.t -= dt; }
  particles = particles.filter(p => p.t > 0);
}
function updateToasts(dt) {
  // 溜まっているときは早送り(1件あたり 2.6秒 → 1.2秒)
  if (achvToasts.length) { achvToasts[0].t += dt * (achvToasts.length > 2 ? 2.2 : 1); if (achvToasts[0].t > 2.6) achvToasts.shift(); }
}
function updateFloats(dt) {
  updateToasts(dt);
  for (const f of floats) { f.y -= 20 * dt; f.t -= dt; }
  floats = floats.filter(f => f.t > 0);
}

/* ---------------- 更新 ---------------- */
function update(dt) {
  if (deathTimer > 0) {
    deathTimer -= dt;
    updateParticles(dt); updateFloats(dt);
    if (deathTimer <= 0) applyDeath();
    return;
  }
  if (player.invuln > 0) player.invuln -= dt;

  // 平面: 自由移動(斜めもなめらか)
  if (!surf.is3D) {
    const mv = freeMovePlayer(dt);
    if (state !== 'play') return;
    return updateWorld(dt, mv || !!inputVec());
  }
  // 立体: マスごとに上下左右
  if (player.overT > 0) { player.overT -= dt; if (!player.drawing && overPaintAt(player, 1, 0) > 0) unlock('over'); if (player.overT <= 0 && !player.drawing && !isBoundary(player.c)) snapPlayerToBoundary(); }
  const d = currentDir();
  const spd = (player.drawing
    ? (held.fast ? CONFIG.DRAW_FAST : CONFIG.DRAW_SLOW)
    : CONFIG.PLAYER_SPEED) * surf.def.speed;
  let stepped = false;
  if (d && spd > 0) {
    player.acc += dt * spd;
    while (player.acc >= 1) {
      player.acc -= 1;
      if (playerMove(d)) stepped = true;
      else { player.acc = 0; break; }
      if (state !== 'play' || deathTimer > 0) break; // クリア/ミス発生時は中断
    }
  } else {
    player.acc = 0;
  }
  if (state !== 'play') return;
  updateWorld(dt, stepped || !!d);
}
// 自機が動いたあとの、敵・アイテム・時間などの更新(平面・立体共通)
function updateWorld(dt, stepped) {
  if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; }

  updateQixes(dt);
  if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; }

  updateSparxes(dt);
  if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; }
  if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; }
  if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; }
  if (hasRivals()) { updateRivals(dt); updateTowers(dt); if (state !== 'play') return; updateVoices(); updateBanter(dt); if (state !== 'play') { Snd.voiceStopAll(); for (const r of rivals) r.voice = false; return; } if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; } }
  if (fieldDirty) { fieldDirty = false; redrawField(); }
  updateItems(dt);
  areaTime += dt;
  // 残機0(最後の1機)のときは心臓の鼓動
  if (lives === 0 && !vsTimeRule()) { heartT -= dt; if (heartT <= 0) { Snd.heart(); heartT = 0.95; } } else heartT = 0;
  stats.time += dt;
  // ナワバリバトル: 時間切れで勝負
  if (pendingEnds.length) { const fs = pendingEnds; pendingEnds = []; for (const f of fs) f(); if (state !== 'play') return; }
  if (hasRivals()) { checkLeader(dt); lapseRecord(dt); }
  if (hasRivals() && !isStock()) {
    const s0 = Math.ceil(vsT);
    vsT -= dt;
    if (vsT <= 0) { vsT = 0; Bgm.climax = false; vsEnd(); return; }
    // 決着前の10秒: BGM が転調して盛り上がる。画面は光らせず、文字と秒読みの音だけ
    if (vsT <= CONFIG.CLIMAX_TIME && !Bgm.climax) {
      Bgm.climax = true;
      floats.push({ x: W / 2, y: FIELD_Y + 120, txt: 'ラスト' + CONFIG.CLIMAX_TIME + '秒!', t: 1.8, col: '#ffd76b', big: true });
    }
    if (Math.ceil(vsT) < s0 && vsT <= CONFIG.CLIMAX_TIME) Snd.tick(vsT <= 3);
  }
  updateParticles(dt);
  updateFloats(dt);
}

// 状態遷移などフレーム毎の付随処理(ヘッドレステスト可能なよう分離)
function tickMeta(dt) {
  if (shakeT > 0) shakeT -= dt;
  if (state !== 'play' && Snd.voiceCount) { Snd.voiceStopAll(); for (const r of rivals) r.voice = false; }   // 試合の外では描く音を鳴らさない
  // タイトルでは8秒ごとに背景の盤面を次へ(ステージを1つに決めているときはそのまま)
  if (state === 'title') {
    demoT += dt;
    if (demoT > 8) { demoT = 0; demoLv++; initLevel(demoLv); say(surf.def.label + '!', 1.6, true); }
  } else demoT = 0;
  // 音の反応: 導火線やポーズでBGMがこもる、ピンチ(残機0)でも少しこもる
  const cut = state === 'pause' ? 500 : deathTimer > 0 ? 700
            : (state === 'play' && lives === 0) ? 6000 : 18000;
  let pan = 0;
  if (surf && grid) { const p = surf.screenOf(player.c); pan = (p.x - W / 2) / (W / 2) * 0.7; }
  Snd.react(cut, pan);
  if (state === 'ready' && stTimer >= CONFIG.READY_TIME) setState('play');
