}

/* ---------------- 描画 ---------------- */
// テーマに応じたQIXの線色(hueは0..360で回転している)
function qixStroke(h, light, alpha) {
  const t = theme();
  if (t.qixSat0) return `hsla(0, 0%, ${light + 15}%, ${alpha})`;
  if (t.qixHue) h = t.qixHue[0] + (h / 360) * (t.qixHue[1] - t.qixHue[0]);
  return `hsla(${h}, 95%, ${light}%, ${alpha})`;
}

// ポインタ用ヒット領域(描画時に更新)
let optRects = [], titleOptRect = null, titleModeRect = null, pauseRect = { x: W - 42, y: 6, w: 36, h: 36 };

function drawDiamond(px, py, r) {
  ctx.beginPath();
  ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py);
  ctx.closePath(); ctx.fill();
}
// SPARX = バチッコ: 線の上を走る火の玉。暗いふちどりの丸い体に、怒った目と揺れる炎の髪。点滅はしない
function drawSparx(px, py, s) {
  if (lapsePlay) return;                               // タイムラプス中は盤面だけ見せる
  const waiting = s.wait > 0;
  ctx.globalAlpha = waiting ? 0.4 : 1;
  // 走った跡の炎の尾
  if (s.hist && s.hist.length && !waiting) {
    ctx.lineCap = 'round';
    let prev = { x: px, y: py };
    s.hist.forEach((c, i) => {
      if (surf.is3D && !visA[c]) return;
      const q = surf.screenOf(c);
      if (Math.hypot(q.x - prev.x, q.y - prev.y) > 40) return;
      ctx.strokeStyle = `rgba(255,120,40,${0.5 * (1 - i / s.hist.length)})`;
      ctx.lineWidth = 6 - i;
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      prev = q;
    });
  }
  const R = 8;
  // 炎の髪(ゆっくり揺れる)
  ctx.fillStyle = '#ffb02e';
  for (let k = -2; k <= 2; k++) {
    const a = -Math.PI / 2 + k * 0.45 + Math.sin(blinkT * 5 + k + s.c) * 0.12, h = R + 6 - Math.abs(k) * 1.5;
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(a - 0.3) * R * 0.8, py + Math.sin(a - 0.3) * R * 0.8);
    ctx.lineTo(px + Math.cos(a) * h, py + Math.sin(a) * h);
    ctx.lineTo(px + Math.cos(a + 0.3) * R * 0.8, py + Math.sin(a + 0.3) * R * 0.8);
    ctx.fill();
  }
  // 体
  ctx.fillStyle = '#1a0a08';
  ctx.beginPath(); ctx.arc(px, py, R + 2, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(px - 2, py - 3, 1, px, py, R);
  g.addColorStop(0, '#ffcf6b'); g.addColorStop(1, '#ff4b1f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
  // 怒った目
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px - 3, py, 2.2, 0, Math.PI * 2); ctx.arc(px + 3, py, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0a08';
  ctx.beginPath(); ctx.arc(px - 2.6, py + 0.4, 1.1, 0, Math.PI * 2); ctx.arc(px + 3.4, py + 0.4, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#1a0a08'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(px - 5.5, py - 3.6); ctx.lineTo(px - 1.2, py - 2); ctx.moveTo(px + 5.5, py - 3.6); ctx.lineTo(px + 1.2, py - 2); ctx.stroke();
  ctx.globalAlpha = 1;
}
/* ---- 自機 Clawd(ドット絵) ----
   13×9 ドット。体・目・腕・4本脚。歩くと脚が交互に上がって体が弾み、
   線を引いている間は腕を振る。ときどきまばたき。o の中身:
   moving/walkF: 歩きアニメ, drawing: 腕振り, look: 目線(-1/0/1), blink, dead */
const CLAWD_COL = '#d97757', CLAWD_EYE = '#1d1411';
function clawdCol() { return CLAWD_COL; }
function drawClawd(cx, cy, s, o) {
  o = o || {};
  const x0 = cx - 6.5 * s, y0 = cy - 4.5 * s - (o.moving && o.walkF ? s : 0);
  const px = (c, r, w, h) => ctx.fillRect(x0 + c * s, y0 + r * s, w * s, h * s);
  ctx.fillStyle = o.col || clawdCol();
  px(2, 0, 9, 7);                                        // 体
  const wave = o.drawing ? (Math.floor(blinkT * 8) & 1) : 0;
  px(0, o.drawing ? 2 - wave : 3, 2, 2);                 // 左腕
  px(11, o.drawing ? 1 + wave : 3, 2, 2);                // 右腕
  [3, 5, 7, 9].forEach((c, i) => {                        // 脚
    const up = o.moving && ((i & 1) === (o.walkF | 0));
    px(c, 7, 1, up ? 1 : 2);
  });
  ctx.fillStyle = CLAWD_EYE;
  const ex = o.look || 0;
  if (o.dead) { px(3 + ex, 2, 2, 1); px(8 + ex, 2, 2, 1); }
  else if (o.blink) { px(4 + ex, 2, 1, 1); px(8 + ex, 2, 1, 1); }
  else { px(4 + ex, 1, 1, 2); px(8 + ex, 1, 1, 2); }
}
// ローラー: 進む向きの前に置き、線を引いている間はインク色になる
function drawRoller(p, s, t) {
  let dx = player.look, dy = 0;
  if (!surf.is3D && (player.vx || player.vy)) { dx = player.vx; dy = player.vy; }
  else if (player.prev >= 0) {
    const q = surf.screenOf(player.prev), l = Math.hypot(p.x - q.x, p.y - q.y);
    if (l > 0.5 && l < 60) { dx = (p.x - q.x) / l; dy = (p.y - q.y) / l; }
  }
  const col = player.drawing || isVS() ? trailHex(player.usedFast) : (inkMode() || inkRainbow()) ? inkHex() : '#c9c2b6';   // ローラー = 次に塗る色(ナワバリバトルはいつもチームの色)
  const rx = p.x + dx * 7 * s, ry = p.y + dy * 7 * s;   // ローラーの中心
  const px = -dy, py = dx, half = 5.5 * s;               // ローラーの軸(進む向きに直角)
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#3b3440'; ctx.lineWidth = 1.6 * s * 0.6;   // 柄
  ctx.beginPath(); ctx.moveTo(p.x, p.y - 2 * s); ctx.lineTo(rx, ry); ctx.stroke();
  ctx.strokeStyle = '#2a2230'; ctx.lineWidth = 4.2 * s;           // ローラーのふち
  ctx.beginPath(); ctx.moveTo(rx - px * half, ry - py * half); ctx.lineTo(rx + px * half, ry + py * half); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 3 * s;                   // ローラー本体
  ctx.beginPath(); ctx.moveTo(rx - px * half, ry - py * half); ctx.lineTo(rx + px * half, ry + py * half); ctx.stroke();
}
function drawPlayer(t) {
  if (lapsePlay) return;                               // タイムラプス中はキャラを出さない(盤面だけ見せる)
  const p = playerScreen(), s = 2 * (surf.is3D ? 1 : sprK());
  if (deathTimer > 0) { // くるくる回って小さくなる
    ctx.save();
    ctx.globalAlpha = clamp(deathTimer / 1.2, 0, 1);
    ctx.translate(p.x, p.y);
    ctx.rotate((1.2 - deathTimer) * 9);
    drawClawd(0, 0, s * (0.5 + deathTimer / 2), { dead: true });
    ctx.restore();
    drawSpeech(p.x, p.y - 4 * s);
    return;
  }
  const ghost = player.invuln > 0;          // 復活直後は点滅させず半透明に
  const moving = blinkT - player.moveT < 0.18;
  const cheer = state === 'clear';                    // クリア: ぴょんぴょん跳ねて腕を振る
  const jump = cheer ? Math.abs(Math.sin(stTimer * 9)) * 5 * s : 0;
  const glow = player.drawing ? trailHex(player.usedFast) : t.accent;
  const cx = p.x, cy = p.y - s * 2 - jump;
  // SHIELD: まわりに泡
  if (player.overT > 0) {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -blinkT * 20;
    ctx.beginPath(); ctx.arc(cx, cy, 13 * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  if (player.shield) {
    ctx.strokeStyle = ITEMS.shield.col;
    ctx.globalAlpha = 0.45 + 0.25 * Math.sin(blinkT * 6);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 11 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (ghost) {                                        // 復活直後: うっすら透けるだけにして、白い輪が広がる
    const k = (blinkT * 1.2) % 1;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, 10 + k * 24, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.85;
  }
  drawRoller(p, s, t);
  ctx.shadowColor = starT > 0 ? ITEMS.star.col : 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = starT > 0 ? 14 : 4;
  drawClawd(cx, cy, s, {
    moving: moving || cheer, walkF: Math.floor(blinkT * 12) & 1, drawing: player.drawing || cheer,
    // 3秒止まっているときょろきょろ
    look: blinkT - player.moveT > 3 ? (Math.sin(blinkT * 1.7) > 0 ? 1 : -1) : player.look, blink: (blinkT % 3.3) < 0.12,
  });
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  drawSpeech(cx, cy - 4 * s);
  // 敵が近いときは頭に「!」
  if (danger > 0 && speech.t <= 0 && Math.floor(blinkT * 8) & 1) {
    ctx.fillStyle = '#ff3b3b';
    ctx.font = "bold 18px 'Courier New', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('!', cx, cy - 7 * s);
  }
}

// アイテム: 色の光る玉に記号。消える前は点滅
function drawItem(it, p, faint) {
  const I = ITEMS[it.k], left = CONFIG.ITEM_LIFE - it.t;
  const fade = left < 3 ? left / 3 : 1;     // 消えかけは薄くなる(点滅しない)
  const r = 10 + Math.sin(blinkT * 5 + it.c) * 1.5;
  ctx.globalAlpha = (faint ? 0.3 : 1) * fade;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2);
  g.addColorStop(0, I.col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = I.col; ctx.lineWidth = 2;
  ctx.globalAlpha = (faint ? 0.3 : 1) * fade;
  ctx.setLineDash([4, 4]); ctx.lineDashOffset = -blinkT * 20;   // まわる破線の輪
  ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff';
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.textAlign = 'center';
  ctx.fillText(I.mark, p.x, p.y + 5);
  if (it.k === 'over') {                     // 上塗り: 大きめの3色の輪と名前
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = TEAM_SHADES[k][0]; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 9, blinkT * 2 + k * 2.09, blinkT * 2 + k * 2.09 + 1.6); ctx.stroke();
    }
    ctx.font = "bold 12px 'Courier New', monospace";
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(p.x - 26, p.y + 20, 52, 16);
    ctx.fillStyle = '#ffffff'; ctx.fillText('上塗り', p.x, p.y + 32);
  }
  ctx.globalAlpha = 1;
}
function drawItems() {
  if (lapsePlay) return;                               // タイムラプス中はキャラを出さない(盤面だけ見せる)
  for (const it of items) {
    if (surf.is3D && !visA[it.c]) { drawOffMarker(surf.screenOf(it.c), ITEMS[it.k].col, 5); continue; }   // 裏側は方向だけ
    drawItem(it, surf.screenOf(it.c), surf.is3D && surf.twoSided && !frontA[it.c]);
  }
}
// 危険度: SPARX / SEEKER が画面上で自機にどれだけ近いか(0〜1)
let danger = 0, dangerSndT = 0;
function calcDanger() {
  danger = 0;
  if (state !== 'play' || deathTimer > 0 || player.invuln > 0) return 0;
  const p = surf.screenOf(player.c), R = 80;
  const near = (c, need) => {
    if (surf.is3D && need && !visA[c]) return;
    const q = surf.screenOf(c), d = Math.hypot(q.x - p.x, q.y - p.y);
    if (d < R) danger = Math.max(danger, 1 - d / R);
  };
  for (const sp of sparxes) if (!(sp.wait > 0)) near(sp.c, true);
  // 近いほど速いテンポでチリチリ鳴らす
  dangerSndT -= 1 / 60;
  if (danger > 0.35 && dangerSndT <= 0) { Snd.fuseCr(); dangerSndT = 0.35 - danger * 0.25; }
  return danger;
}
// 危険なときは画面のふちが赤く脈打つ
function drawDangerEdge() {
  if (danger <= 0) return;
  const a = danger * 0.3;   // 脈打たせない
  const g = ctx.createRadialGradient(W / 2, (FIELD_Y + H) / 2, 260, W / 2, (FIELD_Y + H) / 2, 520);
  g.addColorStop(0, 'rgba(255,40,40,0)');
  g.addColorStop(1, `rgba(255,40,40,${a})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, FIELD_Y, W, H - FIELD_Y);
}

// 画面上部: いま効いている効果とコンボ
function drawStatus() {
  let x = 10;
  const y = FIELD_Y + 10;
  ctx.textAlign = 'left';
  ctx.font = "bold 11px 'Courier New', monospace";
  const pill = (txt, col) => {
    const w = ctx.measureText(txt).width + 14;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, y, w, 18);
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 17);
    ctx.fillStyle = col; ctx.fillText(txt, x + 7, y + 13);
    x += w + 6;
  };
  if (slowT > 0) pill('S SLOW ' + Math.ceil(slowT), ITEMS.slow.col);
  if (starT > 0) pill('★ x2 ' + Math.ceil(starT), ITEMS.star.col);
  if (ink.rainbowT > 0) pill('≋ RAINBOW ' + Math.ceil(ink.rainbowT), hslHex(blinkT * 140, 88, 66));
  if (player.shield) pill('◆ SHIELD', ITEMS.shield.col);
  if (combo > 0 && comboT > 0) {
    pill('COMBO ×' + Math.min(CONFIG.COMBO_MAX, 1 + combo * CONFIG.COMBO_STEP), '#ffd76b');
    ctx.fillStyle = '#ffd76b';
    ctx.fillRect(x - 6 - 60, y + 19, 60 * comboT / CONFIG.COMBO_TIME, 2);
  }
}
// 実績解除のお知らせ(上から降りてくる)
function drawToast(t) {
  const q = achvToasts[0];
  if (!q) return;
  const slide = Math.min(1, q.t * 5, (2.6 - q.t) * 5), y = FIELD_Y - 40 + slide * 70;
  ctx.fillStyle = 'rgba(20,14,4,0.92)';
  ctx.fillRect(W / 2 - 190, y - 22, 380, 44);
  ctx.strokeStyle = '#ffd76b'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 189, y - 21, 378, 42);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd76b'; ctx.font = "bold 12px 'Courier New', monospace";
  ctx.fillText('★ 実績解除 ★', W / 2, y - 5);
  ctx.fillStyle = '#ffffff'; ctx.font = "bold 15px 'Courier New', monospace";
  ctx.fillText(q.a.name + ' ─ ' + q.a.txt, W / 2, y + 14);
}

// 右下の小窓: 立体を真裏から見た様子(点で描くホログラム風)
function drawBackView(t) {
  const S = surf, R = cam.R, P = S.pos;
  const cx = W - 76, cy = H - 76, sc = 56;
  ctx.fillStyle = 'rgba(4,6,16,0.72)';
  ctx.beginPath(); ctx.arc(cx, cy, 66, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = shade(t.accent, 0.8); ctx.lineWidth = 1.5; ctx.stroke();
  const paths = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  const step = S.N > 7000 ? 2 : 1;
  for (let c = 0; c < S.N; c += step) {
    const x = P[c * 3], y = P[c * 3 + 1], z = P[c * 3 + 2];
    if (R[6] * x + R[7] * y + R[8] * z > 0.05) continue;         // 真裏から見て手前側だけ
    const X = -(R[0] * x + R[1] * y + R[2] * z), Y = R[3] * x + R[4] * y + R[5] * z;
    const g = grid[c], a = colA[c];
    const k = g === OPEN ? 0 : g === TRAIL ? 4 : a === 0 ? 2 : a === HOME_COL ? 3 : 1;
    paths[k].rect(cx + X * sc - 1, cy - Y * sc - 1, 2, 2);
  }
  const cols = [shade(t.accent, 0.45), themePal[1] || t.accent, '#ffffff', shade(t.accent, 0.7), t.trailS];
  paths.forEach((pa, i) => { ctx.fillStyle = cols[i]; ctx.fill(pa); });
  const dot = (w, col, r) => {
    if (R[6] * w[0] + R[7] * w[1] + R[8] * w[2] > 0.05) return;
    const X = -(R[0] * w[0] + R[1] * w[1] + R[2] * w[2]), Y = R[3] * w[0] + R[4] * w[1] + R[5] * w[2];
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + X * sc, cy - Y * sc, r, 0, Math.PI * 2); ctx.fill();
  };
  const cw = c => [P[c * 3], P[c * 3 + 1], P[c * 3 + 2]];
  for (const it of items) dot(cw(it.c), ITEMS[it.k].col, 3);
  for (const sp of sparxes) dot(cw(sp.c), '#ff5a28', 3);
  for (const r of rivals) if (r.dead <= 0) dot(cw(r.c), teamHex(r.team), 3);
  for (const q of qixes) dot(S.world(q.p || [q.x, q.y]), qixStroke(q.hue, 60, 1), 4.5);
  ctx.fillStyle = '#8fa3d9';
  ctx.font = "bold 10px 'Courier New', monospace";
  ctx.textAlign = 'center';
  ctx.fillText('うら側', cx, cy + 80 > H - 4 ? cy - 70 : cy + 80);
}

function render() {
  const t = theme();
  ctx.save();
  if (shakeT > 0 && settings.shake) {
    const a = shakeT * 9;
    ctx.translate(rand(-a, a), rand(-a, a));
  }

  ctx.fillStyle = t.field;
  ctx.fillRect(-8, -8, W + 16, H + 16);
  applyZoomPunch();
  if (surf.is3D) render3D(t);
  else render2D(t);
  drawItems();
  drawTowers();
  if (rivals.length && !surf.is3D) drawRivals(t);
  if (rivals.length && surf.is3D) drawRivals3D(t);
  if ((rivals.length || souls.length)) drawSouls(false);
  drawShots(); drawHpBars();
  if (isVS() && rivals.length && (state === 'play' || state === 'ready' || state === 'pause')) drawVsHud();
  if (surf.is3D && !['title', 'options', 'achv', 'stats', 'help', 'gallery'].includes(state) && !isResult()) drawBackView(t);
  if (state === 'play' || state === 'ready' || state === 'pause') drawStatus();

  // インクのしずく(ふつうの合成)
  for (const p of particles) {
    if (!p.ink) continue;
    ctx.globalAlpha = Math.min(1, p.t * 3);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  // パーティクルと光の輪(加算合成)
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    if (p.ink) continue;
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  for (const r of rings) {
    if (r.t < 0) continue;                             // 少し遅れて出る輪
    ctx.globalAlpha = 1 - r.t;
    ctx.strokeStyle = r.col;
    ctx.lineWidth = (3 + 6 * (1 - r.t)) * (r.w || 1);
    ctx.beginPath(); ctx.arc(r.x, r.y, 12 + r.t * (r.R || 460), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // ビネット(CRT効果ON時)
  if (settings.crt) ctx.drawImage(vigC, 0, FIELD_Y);

  // フロート文字
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.t);
    ctx.fillStyle = f.col;
    if (f.T == null) f.T = f.t;
    const sz = f.size ? f.size * (0.7 + 0.3 * Math.min(1, (f.T - f.t) / 0.25)) : 0;
    ctx.font = (sz ? "bold " + Math.round(sz) + "px" : f.big ? "bold 24px" : "bold 14px") + " 'Courier New', monospace";
    const fx = sz ? clamp(f.x, sz * f.txt.length * 0.32, W - sz * f.txt.length * 0.32) : clamp(f.x, 40, W - 40), fy = clamp(f.y, FIELD_Y + 16 + sz, H - 8);
    if (sz) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, sz * 0.2); ctx.strokeStyle = 'rgba(4,6,16,0.85)'; ctx.strokeText(f.txt, fx, fy); }   // 大きな文字は暗いふちで読みやすく
    ctx.fillText(f.txt, fx, fy);
  }
  ctx.globalAlpha = 1;
  drawBanner();

  renderHUD();
  renderOverlay();
  drawToast(t);
  ctx.restore();
  if (settings.glow && !perf.lite) drawBloom();
}

// 発光: 画面を小さく縮めて(ぼかして)から、加算合成で重ねる
const bloom1 = document.createElement('canvas'), bloom2 = document.createElement('canvas');
bloom1.width = W / 4; bloom1.height = H / 4; bloom2.width = W / 8; bloom2.height = H / 8;
const b1ctx = bloom1.getContext('2d'), b2ctx = bloom2.getContext('2d');
function drawBloom() {
  b1ctx.imageSmoothingEnabled = b2ctx.imageSmoothingEnabled = true;
  b1ctx.clearRect(0, 0, bloom1.width, bloom1.height);
  b1ctx.drawImage(cv, 0, 0, bloom1.width, bloom1.height);
  b2ctx.clearRect(0, 0, bloom2.width, bloom2.height);
  b2ctx.drawImage(bloom1, 0, 0, bloom2.width, bloom2.height);
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.22; ctx.drawImage(bloom1, 0, 0, W, H);
  ctx.globalAlpha = 0.30; ctx.drawImage(bloom2, 0, 0, W, H);
  ctx.restore();
}


/* =====================================================================
   タワー(ナワバリディフェンス)
   陣地を取ると、一度に囲んだ広さに応じたタワーが、その陣地の奥に建つ(建設アニメのあと動き出す)。
   タワーは射程に入った相手(ファイター。設定でヌメリン・バチッコも)をいちばん近い順に撃つ。
   ファイターは体力 FIGHTER_HP。0 でやられる(今までのやられ方と同じ)。しばらく撃たれなければ回復する。
   タワーの下の陣地を上塗りされると、タワーは壊れる。1人 TOWER_MAX 基まで(こえたら古いものから撤去)
   ===================================================================== */
// min: 一度に囲んだ広さ(盤面の%)/ range: 射程(ふつうの広さの平面のマス)/ cd: 次に撃つまでの秒 / dmg: 1発の強さ
const TOWERS = [
  { k:'gun',     name:'機銃',             min:0.5, range:14, cd:0.55, dmg:1, shot:'bullet' },
  { k:'twin',    name:'ツイン機銃',       min:1.5, range:15, cd:0.6,  dmg:1, shot:'bullet', n:2 },
  { k:'missile', name:'ミサイルランチャー', min:3,  range:24, cd:1.8,  dmg:2, shot:'missile' },
  { k:'mortar',  name:'迫撃砲',           min:5,   range:26, cd:2.4,  dmg:2, shot:'shell', splash:5 },
  { k:'laser',   name:'レーザー砲台',     min:8,   range:30, cd:2.1,  dmg:3, shot:'beam' },
  { k:'tesla',   name:'テスラコイル',     min:12,  range:18, cd:1.7,  dmg:1, shot:'zap', chain:3 },
  { k:'fort',    name:'要塞ミサイル',     min:18,  range:34, cd:3.2,  dmg:2, shot:'missile', n:4 },
];
const FIGHTER_HP = 5, TOWER_MAX = 10, BUILD_T = 1.8, HP_REGEN_WAIT = 3, HP_REGEN = 0.7;
let towers = [], shots = [], towerChkT = 0, buildSndT = 0, fireSndT = 0;
// 一度に囲んだ広さ → タワーの段階(0〜6)。小さすぎると -1(建たない)
function towerTier(pct) { let lv = -1; TOWERS.forEach((d, i) => { if (pct >= d.min) lv = i; }); return lv; }
// 射程の目安の倍率: 盤面が広いほどマスで数えた射程も長く(平面のふつうの広さで 1 くらい)
function towerScale() { return clamp(Math.sqrt(initOpen || surf.N) / 135, 0.35, 2); }
function towerRange(T) { return TOWERS[T.lv].range * towerScale(); }

// ---- ねらう相手 ----

// ---- 毎フレーム: 建設・ねらう・撃つ・弾・体力の回復・こわれたかの確認 ----

        if (towerVisible(T)) { rings.push({ x: p.x, y: p.y, t: 0, col: teamHex(T.team), R: 90, w: 0.7 }); spawnParticles(p.x, p.y, 12, teamHex(T.team)); }
        if (T.own === 1) { floats.push({ x: p.x, y: p.y - 24, txt: TOWERS[T.lv].name + ' 起動!', t: 1.4, col: teamHex(T.team) }); Snd.select(); }

// ---- 自動で塗る(近くに敵がいないとき) ----

// インクが落ちたところを塗る: 空き地 → 自分の陣地 / 中立 → 自分の陣地。ふちは線(ネオン)にする

// ---- 乗っ取り ----

/* ---- タワーの絵(斜め上から見た立体風)。細かい絵は種類・チームごとに一度だけ描いてしまっておく ----

function updateFx(dt) {

  if (q.warn) {           // 突進の予告: 怒り眉と「!」(点滅なし)
    ctx.strokeStyle = '#10121e'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(c.x - 8, c.y - 6); ctx.lineTo(c.x - 2, c.y - 4); ctx.moveTo(c.x + 8, c.y - 6); ctx.lineTo(c.x + 2, c.y - 4); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = "bold 16px 'Courier New', monospace"; ctx.textAlign = 'center';
    ctx.fillText('!', c.x, c.y - R - 6);
  } else {
    ctx.strokeStyle = '#10121e'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(c.x, c.y + 3.5, 2.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---- QIXのリボン: 隣り合う残像の間を半透明の帯で塗る ---- */
function qixEnds(sg) {
  if (!surf.is3D) return [{ x: sg.x1 * CS, y: FIELD_Y + sg.y1 * CS }, { x: sg.x2 * CS, y: FIELD_Y + sg.y2 * CS }];
  const S = surf, a = sg.pts[0], b = sg.pts[sg.pts.length - 1];
  if (!visA[S.ptCell(a)] || !visA[S.ptCell(b)]) return null;
  const wa = S.world(a), wb = S.world(b);
  if (vdist(wa, wb) > 0.6) return null;          // 貼り合わせの縁をまたいだものは描かない
  return [projXYZ(wa[0] * 1.012, wa[1] * 1.012, wa[2] * 1.012), projXYZ(wb[0] * 1.012, wb[1] * 1.012, wb[2] * 1.012)];
}
function drawQixRibbons() {
  for (const q of qixes) {
    let prev = null;
    for (let i = 0; i < q.segs.length; i++) {
      const e = qixEnds(q.segs[i]);
      if (e && prev) {
        ctx.fillStyle = qixStroke(q.segs[i].h, 55, 0.12 * (i + 1) / q.segs.length);
        ctx.beginPath();
        ctx.moveTo(prev[0].x, prev[0].y); ctx.lineTo(prev[1].x, prev[1].y);
        ctx.lineTo(e[1].x, e[1].y); ctx.lineTo(e[0].x, e[0].y);
        ctx.closePath(); ctx.fill();
      }
      prev = e;
    }
  }
}

/* ---- 描いている線の光(平面・立体共通) ---- */
function drawInkTrail(t) {
  // 描いている線: 太いインクの帯(暗いふち + インク + つや)。光らせたり点滅させたりはしない
  if (!trail.length) return;
  const col = trailHex(player.usedFast), w = surf.is3D ? 6.5 : CS * 1.35;
  const path = new Path2D();
  let pen = false, prev = null;
  if (!surf.is3D && player.pts.length) {     // 平面: 実際に通った道すじをなめらかに
    const pp = player.pts.concat([[player.fx, player.fy]]);
    path.moveTo(pp[0][0] * CS, FIELD_Y + pp[0][1] * CS);
    for (let i = 1; i < pp.length; i++) path.lineTo(pp[i][0] * CS, FIELD_Y + pp[i][1] * CS);
    inkBand(path, col, w);
    return;
  }
  for (const c of [trailStart].concat(trail, [player.c])) {
    if (c < 0 || (surf.is3D && !visA[c])) { pen = false; continue; }
    const p = surf.screenOf(c);
    if (pen && Math.hypot(p.x - prev.x, p.y - prev.y) > 60) pen = false;
    if (pen) path.lineTo(p.x, p.y); else { path.moveTo(p.x, p.y); pen = true; }
    prev = p;
  }
  inkBand(path, col, w);
}
// インクの帯(ネオン風): うっすら色の光 + 暗いふち + インク + 真ん中の白い芯。点滅はしない
// 描いている線も、できあがった線も同じ見た目(g = 描き先。省略すると画面)
function inkBand(path, col, w, g) {
  g = g || ctx;
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.globalAlpha = 0.22; g.strokeStyle = col; g.lineWidth = w * 2.2; g.stroke(path);
  g.globalAlpha = 1;
  g.strokeStyle = shade(col, 0.45); g.lineWidth = w + 2; g.stroke(path);
  g.strokeStyle = col; g.lineWidth = w; g.stroke(path);
  g.strokeStyle = mixHex(col, '#ffffff', 0.6); g.lineWidth = w * 0.5; g.stroke(path);   // 芯のまわりのにじみ
  g.strokeStyle = '#ffffff'; g.lineWidth = Math.max(1.2, w * 0.24); g.stroke(path);     // 白い芯
  g.restore();
}
// できあがった線の持ち主の色(ナワバリバトルのみ。持ち主がいない線 = 最初の壁・中立は null)
function lineOwnerHex(c) {
  if (!isVS() || grid[c] !== WALL || colA[c] !== 0 || baseA[c]) return null;
  const o = ownA[c];
  if (o === 1) return teamHex(0);
  const r = o >= 2 && o !== OWN_NEUTRAL ? rivals[o - 2] : null;
  return r ? teamHex(r.team) : null;
}
// できあがった線をネオンの帯で描く。pos(c) = 画面の位置、ok(c) = 描いてよいマス
function drawOwnedLines(g, cells, pos, w, ok) {
  const paths = {};
  for (const c of cells) {
    const hx = lineOwnerHex(c);
    if (!hx || (ok && !ok(c))) continue;
    const p = pos(c), P = paths[hx] || (paths[hx] = new Path2D());
    let solo = true;
    for (let k = 0; k < 4; k++) {
      const n = surf.nb[c * 4 + k];
      if (n < 0 || !lineOwnerHex(n) || (ok && !ok(n))) continue;
      solo = false;
      if (n < c) continue;                            // 同じつなぎ目を2回描かない
      const q = pos(n);
      if (Math.hypot(q.x - p.x, q.y - p.y) > w * 6) continue;   // 継ぎ目の向こう側へは線を引かない
      P.moveTo(p.x, p.y); P.lineTo(q.x, q.y);
    }
    if (solo) { P.moveTo(p.x, p.y); P.lineTo(p.x + 0.01, p.y); }
  }
  for (const hx in paths) inkBand(paths[hx], hx, w, g);
}
function mixHex(a, b, k) { return hexOf(mixRgb(rgbOf(a), rgbOf(b), k)); }

/* ---- 立体面の描画 ----
   毎フレーム: 頂点を投影 → 裏向きのセルを捨てる → 色×陰影ごとにまとめて塗る。
   へこみのある形(星型・ドーナツ・クラインの壺)は奥から順に塗る(画家のアルゴリズム) */
const buckets = [];
for (let i = 0; i < NCOL * LV; i++) buckets.push([]);
let vxA = new Float32Array(0), vyA = new Float32Array(0), visA = new Uint8Array(0);
let zA = new Float32Array(0), keyA = new Uint16Array(0), frontA = new Uint8Array(0);
const order = [];
const DEPTH_LAYERS = 28;   // へこみのある形を塗るときの奥行きの層の数

// 立体の輪郭のおおよその半径(画面上px)。裏側の敵の位置マーカーを置くのに使う
function rimRadius() { return surf.sph ? cam.F / Math.sqrt(cam.D * cam.D - 1) : 290; }

// 宇宙の背景: 星雲と星。カメラの回転に合わせて流れる
function drawBackdrop() {
  const R = cam.R, cx = cam.cx, cy = cam.cy, beat = Bgm.pulse();
  ctx.globalCompositeOperation = 'lighter';
  for (const nb of NEBULA) {
    const d = nb.d, Z = R[6] * d[0] + R[7] * d[1] + R[8] * d[2];
    if (Z > 0.5) continue;
    const x = cx + (R[0] * d[0] + R[1] * d[1] + R[2] * d[2]) * 560;
    const y = cy - (R[3] * d[0] + R[4] * d[1] + R[5] * d[2]) * 560;
    const g = ctx.createRadialGradient(x, y, 0, x, y, nb.r);
    g.addColorStop(0, `hsla(${(nb.h + animHue * 8) % 360}, 80%, 55%, 0.12)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - nb.r, y - nb.r, nb.r * 2, nb.r * 2);
  }
  // ワープ中(カメラが遠い)は星が放射状に流れる
  const warp = state === 'ready' ? clamp((cam.D - 3.6) / 5, 0, 1) : 0;   // エリア開始のワープのときだけ
  if (warp > 0.02) {
    ctx.strokeStyle = 'rgba(200,220,255,0.55)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const s of STARS) {
      const d = s.d;
      const x = cx + (R[0] * d[0] + R[1] * d[1] + R[2] * d[2]) * 640, y = cy - (R[3] * d[0] + R[4] * d[1] + R[5] * d[2]) * 640;
      ctx.moveTo(x, y); ctx.lineTo(x + (x - cx) * warp * 0.5, y + (y - cy) * warp * 0.5);
    }
    ctx.stroke();
  }
  ctx.fillStyle = '#ffffff';
  for (const s of STARS) {
    const d = s.d, Z = R[6] * d[0] + R[7] * d[1] + R[8] * d[2];
    if (Z > 0) continue;
    const x = cx + (R[0] * d[0] + R[1] * d[1] + R[2] * d[2]) * 640;
    const y = cy - (R[3] * d[0] + R[4] * d[1] + R[5] * d[2]) * 640;
    if (x < 0 || x > W || y < FIELD_Y || y > H) continue;
    ctx.globalAlpha = 0.3 + 0.35 * Math.sin(blinkT * 1.3 + s.ph);
    ctx.fillRect(x, y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function render3D(t) {
  const S = surf, R = cam.R, D = cam.D, F = cam.F, cx = cam.cx, cy = cam.cy;
  drawBackdrop();
  drawLeaderHalo();
  // 球の後ろにうっすら光の輪
  if (S.sph && !isVS()) {
    const rs = rimRadius();
    const g = ctx.createRadialGradient(cx, cy, rs * 0.9, cx, cy, rs * 1.12);
    g.addColorStop(0, shade(t.accent, 0.45));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, rs * 1.12, 0, Math.PI * 2); ctx.fill();
  }

  if (vxA.length < S.nv) { vxA = new Float32Array(S.nv); vyA = new Float32Array(S.nv); }
  if (visA.length < S.N) { visA = new Uint8Array(S.N); zA = new Float32Array(S.N); keyA = new Uint16Array(S.N); frontA = new Uint8Array(S.N); }
  const [r0, r1, r2, r3, r4, r5, r6, r7, r8] = R;
  const vp = S.vpos;
  for (let v = 0, o = 0; v < S.nv; v++, o += 3) {
    const x = vp[o], y = vp[o + 1], z = vp[o + 2];
    const s = F / (D - (r6 * x + r7 * y + r8 * z));
    vxA[v] = cx + (r0 * x + r1 * y + r2 * z) * s;
    vyA[v] = cy - (r3 * x + r4 * y + r5 * z) * s;
  }
  // 光源をワールド座標へ(Rの転置を掛ける)
  const lx = r0 * LIGHT_V[0] + r3 * LIGHT_V[1] + r6 * LIGHT_V[2];
  const ly = r1 * LIGHT_V[0] + r4 * LIGHT_V[1] + r7 * LIGHT_V[2];
  const lz = r2 * LIGHT_V[0] + r5 * LIGHT_V[1] + r8 * LIGHT_V[2];

  for (const b of buckets) b.length = 0;
  order.length = 0;
  const nor = S.nor, nc = S.nc, par = S.par, P = S.pos, now = blinkT;
  const sealed = state === 'clear';
  const trailCi = isVS() ? TEAMC_CI0 : player.usedFast ? 4 : 5;   // ナワバリバトル: 描きかけの線のマスもチームの色
  for (let c = 0; c < S.N; c++) {
    const nx = nor[c * 3], ny = nor[c * 3 + 1], nz = nor[c * 3 + 2];
    // 表向き判定: 法線・(カメラ位置 − セル位置) > 0
    const front = D * (r6 * nx + r7 * ny + r8 * nz) - nc[c] > 0;
    frontA[c] = front ? 1 : 0;
    if (!front && !S.twoSided) { visA[c] = 0; continue; }
    visA[c] = 1;
    const g = grid[c];
    let ci;
    if (g === OPEN) ci = sealed ? 2 : par[c];
    else if (g === TRAIL) ci = trailCi;
    else if (g === RTRAIL) { const o = rivals[rtOwn[c] - 1]; ci = o ? TEAMC_CI0 + o.team * 4 : 3; }
    else {
      const ca = claimAt[c];
      if (ca > now) ci = par[c];                    // 塗りの波がまだ届いていない
      else {
        const a = colA[c];
        ci = a === 0 ? lineCi(c) : a === HOME_COL ? 6 : a >= TEAMC_BASE ? TEAMC_CI0 + a - TEAMC_BASE : a >= EARTH_BASE ? EARTH_CI0 + a - EARTH_BASE
           : a >= INK_BASE ? 24 + a - INK_BASE + (ringA[c] ? INK_ALL.length + RB_N : 0) : 6 + a + (ringA[c] ? 8 : 0);
        if (mixA[c] && a && a !== HOME_COL) { const mi = mixCi(a, col2A[c], mixA[c], ringA[c]); if (mi >= 0) ci = mi; }
      }
    }
    let lit = nx * lx + ny * ly + nz * lz;
    if (S.twoSided) lit = 0.35 + 0.65 * Math.abs(lit);
    let lvl = lit <= 0 ? 0 : Math.min(LV - 1, (lit * LV) | 0);
    if (!front) lvl = Math.max(0, lvl - 3);         // 両面の形: 内側は暗く
    if (S.sorted) {
      // 奥行きを DEPTH_LAYERS 層に分け、層の中では色ごとにまとめる(塗る回数を減らす)
      const z = r6 * P[c * 3] + r7 * P[c * 3 + 1] + r8 * P[c * 3 + 2];
      const layer = clamp(((z + 1.05) / 2.1 * DEPTH_LAYERS) | 0, 0, DEPTH_LAYERS - 1);
      order.push(c);
      keyA[c] = ci * LV + lvl;
      zA[c] = layer * 4096 + keyA[c];
    } else buckets[ci * LV + lvl].push(c);
  }
  const Q = S.quad, K = S.translucent ? 1.02 : 1.1; // K: 継ぎ目の隙間を消すため少し膨らませる
  const quadPath = c => {
    const a = Q[c * 4], b = Q[c * 4 + 1], d = Q[c * 4 + 2], e = Q[c * 4 + 3];
    const mx = (vxA[a] + vxA[b] + vxA[d] + vxA[e]) * 0.25, my = (vyA[a] + vyA[b] + vyA[d] + vyA[e]) * 0.25;
    ctx.moveTo(mx + (vxA[a] - mx) * K, my + (vyA[a] - my) * K);
    ctx.lineTo(mx + (vxA[b] - mx) * K, my + (vyA[b] - my) * K);
    ctx.lineTo(mx + (vxA[d] - mx) * K, my + (vyA[d] - my) * K);
    ctx.lineTo(mx + (vxA[e] - mx) * K, my + (vyA[e] - my) * K);
    ctx.closePath();
  };
  if (!S.sorted) {
    for (let bi = 0; bi < buckets.length; bi++) {
      const arr = buckets[bi];
      if (!arr.length) continue;
      ctx.fillStyle = col3D[bi];
      ctx.beginPath();
      for (const c of arr) quadPath(c);
      ctx.fill();
    }
  } else {
    order.sort((a, b) => zA[a] - zA[b]);            // 奥の層から、層の中は色ごと
    if (S.translucent) ctx.globalAlpha = 0.8;
    let cur = -1;
    for (const c of order) {
      const k = keyA[c];
      if (k !== cur) { if (cur >= 0) ctx.fill(); cur = k; ctx.fillStyle = col3D[k]; ctx.beginPath(); }
      quadPath(c);
    }
    if (cur >= 0) ctx.fill();
    ctx.globalAlpha = 1;
  }
  drawFighterLights();
  // できあがった線: 描いていたときと同じネオンの帯(表を向いているマスだけ)
  if (isVS()) {
    const lc = [];
    for (let c = 0; c < S.N; c++) if (frontA[c] && grid[c] === WALL && colA[c] === 0 && claimAt[c] <= now) lc.push(c);
    drawOwnedLines(ctx, lc, c => S.screenOf(c), 5.5, c => frontA[c] && claimAt[c] <= now);
  }

  drawInkTrail(t);
  // SPARX(裏側にいるものは輪郭の外にマーカー)
  for (const s of sparxes) {
    const p = S.screenOf(s.c);
    if (!visA[s.c]) { drawOffMarker(p, '#ff5a28', 6); continue; }
    ctx.globalAlpha = frontA[s.c] ? 1 : 0.3;      // 両面の形: 向こう側は透けて薄く
    drawSparx(p.x, p.y, s);
    ctx.globalAlpha = 1;
  }

  drawPlayer(t);

  // QIX = ヌメリン: 見えている側にいるときだけ体を描く(両面の形で向こう側なら薄く)
  for (const q of qixes) {
    const qc = S.qixCell(q);
    if (visA[qc]) drawNumerin(q, S.twoSided && !frontA[qc]);
  }
  for (const q of qixes) if (!visA[S.qixCell(q)]) drawOffMarker(S.qixScreen(q), qixStroke(q.hue, 62, 1), 9);
}

// 裏側にいる敵の方向を、輪郭の外側に三角で示す
function drawOffMarker(p, col, sz) {
  let dx = p.x - cam.cx, dy = p.y - cam.cy;
  const l = Math.hypot(dx, dy);
  if (l < 1) { dx = 0; dy = 1; } else { dx /= l; dy /= l; }
  const r = rimRadius() + 18;
  const x = clamp(cam.cx + dx * r, 14, W - 14), y = clamp(cam.cy + dy * r, FIELD_Y + 14, H - 14);
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(blinkT * 8);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x + dx * sz, y + dy * sz);
  ctx.lineTo(x - dx * sz * 0.6 - dy * sz * 0.8, y - dy * sz * 0.6 + dx * sz * 0.8);
  ctx.lineTo(x - dx * sz * 0.6 + dy * sz * 0.8, y - dy * sz * 0.6 - dx * sz * 0.8);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function renderHUD() {
  const t = theme();
  ctx.fillStyle = t.hud;
  ctx.fillRect(0, 0, W, FIELD_Y);
  ctx.fillStyle = shade(t.accent, 0.35);
  ctx.fillRect(0, FIELD_Y - 2, W, 2);

  // 左: スコア
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8fa3d9';
  ctx.font = "bold 10px 'Courier New', monospace";
  ctx.fillText('SCORE', 10, 16);
  ctx.fillStyle = '#ffffff';
  ctx.font = "bold 17px 'Courier New', monospace";
  ctx.fillText(String(score).padStart(7, '0'), 10, 34);
  ctx.fillStyle = '#6d7ba8';
  ctx.font = "bold 11px 'Courier New', monospace";
  ctx.fillText('HI ' + String(Math.max(hiScore, score)).padStart(7, '0'), 10, 50);

  // 中央: 占領率
  const pct = percent(), tg = target();
  ctx.textAlign = 'center';
  ctx.fillStyle = pct >= tg ? '#7bffa0' : '#ffd76b';
  ctx.font = "bold 19px 'Courier New', monospace";
  ctx.fillText(pct.toFixed(1) + '%', W / 2, 24);
  // 進捗バー(目標位置に印)
  const bw = 150, bx = W / 2 - bw / 2, by = 31;
  ctx.fillStyle = '#1b2340';
  ctx.fillRect(bx, by, bw, 8);
  ctx.fillStyle = pct >= tg ? '#4be07f' : '#e0a83a';
  ctx.fillRect(bx, by, bw * clamp(pct / 100, 0, 1), 8);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bx + bw * tg / 100 - 1, by - 2, 2, 12);
  ctx.fillStyle = '#6d7ba8';
  ctx.font = "bold 10px 'Courier New', monospace";
  ctx.fillText('TARGET ' + tg + '%', W / 2, 52);

  // 右: エリア・盤面・残機・難易度・ポーズボタン
  ctx.textAlign = 'right';
  ctx.fillStyle = '#8fa3d9';
  ctx.font = "bold 11px 'Courier New', monospace";
  ctx.fillText('AREA ' + level + (settings.mode === 'TOUR' ? '/' + CONFIG.TOUR.length : '') + ' ' + surf.def.label, W - 52, 16);
  if (!vsTimeRule()) for (let i = 0; i < Math.min(lives, 6); i++) drawClawd(W - 62 - i * 16, 30, 1);   // 時間制は残機なし
  ctx.fillStyle = '#6d7ba8';
  ctx.font = "bold 10px 'Courier New', monospace";
  ctx.fillText(settings.diff, W - 52, 50);

  // ポーズボタン(タップ可)
  if (state === 'play' || state === 'ready' || state === 'pause') {
    ctx.fillStyle = 'rgba(60,80,140,.35)';
    ctx.fillRect(pauseRect.x, pauseRect.y, pauseRect.w, pauseRect.h);
    ctx.fillStyle = '#cdd8ff';
    if (state === 'pause') {
      ctx.beginPath();
      ctx.moveTo(pauseRect.x + 12, pauseRect.y + 9);
      ctx.lineTo(pauseRect.x + 27, pauseRect.y + 18);
      ctx.lineTo(pauseRect.x + 12, pauseRect.y + 27);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(pauseRect.x + 11, pauseRect.y + 9, 5, 18);
      ctx.fillRect(pauseRect.x + 21, pauseRect.y + 9, 5, 18);
    }
  }
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(4, 6, 16, 0.88)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = shade(theme().accent, 0.7);
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

function renderOverlay() {
  const t = theme();
  if (state === 'help') { drawHelp(t); return; }
  if (state === 'gallery') { drawGallery(t); return; }
  const blinkOn = true;   // 文字は点滅させない(目にやさしく)
  ctx.textAlign = 'center';

  if ((state === 'play' || state === 'ready') && deathTimer > 0) {
    if (blinkOn) {
      ctx.fillStyle = guarded ? '#8dff9e' : '#ff5c8a';
      ctx.font = "bold 34px 'Courier New', monospace";

/* ---------------- メインループ ---------------- */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  watchPerf(dt);
  if (dt > 0.05) dt = 0.05;
  blinkT += dt;
  stTimer += dt;

  pollPad();
  tickMeta(dt);
  tickTheme(dt);
  if (slowMoT > 0) slowMoT -= dt;
  updateFx(dt);
  if (state === 'play') update(slowMoT > 0 ? dt * 0.35 : dt);   // 超ナワバリの瞬間は少しだけスロー
  else {
    // タイトル/オプション/READYではQIXがアトラクト的に泳ぐ
    // (ポーズから開いたOPTIONSの間は止めたまま)
    if (state === 'title' || (state === 'options' && optsFrom === 'title') || state === 'ready') updateQixes(dt);
    updateParticles(dt); updateFloats(dt);
  }

  render();
}

/* ---------------- キーボード ---------------- */
const KEYDIR = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right',
  W:'up', S:'down', A:'left', D:'right',
};
function onKeyDown(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  Snd.ensure();
  // キーコンフィグのキー(立体の上下左右・速く)
  if ((state === 'play' || state === 'ready') && e.code && !KEYDIR[k]) {
    const d = p1Dir(e.code);
    if (d) { pressDir(d); e.preventDefault(); return; }
    if (PLAY_KEYS.f.includes(e.code)) { held.fast = true; e.preventDefault(); return; }
  }

  if (k === 'c' || k === 'C') { saveShot(); e.preventDefault(); return; }
  if (k === 'm' || k === 'M') {
    const m = Snd.toggleMute();
    floats.push({ x: W / 2, y: H / 2, txt: m ? 'MUTE' : 'SOUND ON', t: 1.0, col: '#cdd8ff' });
    e.preventDefault(); return;
  }

  if (state === 'vssetup') { vsSetKey(k, e.repeat); e.preventDefault(); return; }
  if (state === 'keycfg') { keyCfgKey(e); e.preventDefault(); return; }
  if (state === 'matchopts') {
    const d = KEYDIR[k];
    if (d === 'up') { matchSel = (matchSel + MATCH_ITEMS.length - 1) % MATCH_ITEMS.length; Snd.blip(); }
    else if (d === 'down') { matchSel = (matchSel + 1) % MATCH_ITEMS.length; Snd.blip(); }
    else if (d === 'left') matchAdjust(-1);
    else if (d === 'right' || k === 'z' || k === 'Z' || k === 'Enter' || k === ' ') matchAdjust(1);
    else if (k === 'x' || k === 'X' || k === 'Escape') { setState(matchFrom); Snd.select(); }
    e.preventDefault(); return;
  }
  if (lapsePlay && !KEYDIR[k]) { endLapse(false); e.preventDefault(); return; }   // タイムラプス中: 矢印は回す、ほかのキーはとめる
  if ((k === 't' || k === 'T') && canLapse() && stTimer > 1.0) { startLapse(); e.preventDefault(); return; }
  if ((k === 'v' || k === 'V') && isResult() && stTimer > 1.0) { resHide = !resHide; Snd.select(); e.preventDefault(); return; }
  if (state === 'help') {
    if (k === 'z' || k === 'Z' || k === 'x' || k === 'X' || k === 'Escape' || k === 'Enter' || k === ' ' || k === 'h' || k === 'H' || k === 'p' || k === 'P') closeHelp();
    e.preventDefault(); return;
  }
  if ((k === 'h' || k === 'H') && state === 'title') { openHelp(); e.preventDefault(); return; }
  if ((k === 'g' || k === 'G') && state === 'title') { openGallery('title'); e.preventDefault(); return; }
  if (state === 'gallery') {
    const d = KEYDIR[k], N = Math.max(1, gallery.length);
    if (d === 'left') gallerySel = (gallerySel + N - 1) % N;
    else if (d === 'right') gallerySel = (gallerySel + 1) % N;
    else if (d === 'up' && !galleryBig) gallerySel = (gallerySel + N - 4) % N;
    else if (d === 'down' && !galleryBig) gallerySel = (gallerySel + 4) % N;
    else if ((k === 'z' || k === 'Z' || k === 'Enter' || k === ' ') && !galleryBig && gallery.length) { galleryBig = true; Snd.select(); }
    else if (k === 'z' || k === 'Z' || k === 'Enter' || k === ' ' || k === 'x' || k === 'X' || k === 'Escape' || k === 'g' || k === 'G') {
      if (galleryBig) galleryBig = false; else setState(galleryFrom);
      Snd.select();
    }
    if (d) Snd.blip();
    e.preventDefault(); return;
  }

  // 実績一覧・記録: どのボタンでも OPTIONS へ戻る
  if (state === 'achv' || state === 'stats') {
    if (k === 'z' || k === 'Z' || k === 'x' || k === 'X' || k === 'Escape' || k === 'Enter' || k === ' ') { setState('options'); Snd.select(); }
    e.preventDefault(); return;
  }

  // OPTIONS画面の操作
  if (state === 'options') {
    if (k === 'ArrowUp'   || k === 'w' || k === 'W') { optSel = (optSel + OPT_ITEMS.length - 1) % OPT_ITEMS.length; Snd.blip(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { optSel = (optSel + 1) % OPT_ITEMS.length; Snd.blip(); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') adjustOpt(-1);
    else if (k === 'ArrowRight'|| k === 'd' || k === 'D') adjustOpt(1);
    else if (k === 'z' || k === 'Z' || k === ' ' || k === 'Enter') {
      if (OPT_ITEMS[optSel].k === '_back') closeOptions();
      else adjustOpt(1);
    }
    else if (k === 'Escape' || k === 'x' || k === 'X') closeOptions();
    e.preventDefault(); return;
  }

  // ポーズメニュー
  if (state === 'pause') {
    if (KEYDIR[k] === 'up')   { pauseSel = (pauseSel + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length; Snd.blip(); }
    else if (KEYDIR[k] === 'down') { pauseSel = (pauseSel + 1) % PAUSE_ITEMS.length; Snd.blip(); }
    else if (k === 'z' || k === 'Z' || k === ' ' || k === 'Enter') pauseChoose(pauseSel);
    else if (k === 'p' || k === 'P' || k === 'Escape') doResume();
    e.preventDefault(); return;
  }

  // タイトル画面: ←→ は何もしない(モードは VS だけ)
  if (state === 'title' && (KEYDIR[k] === 'left' || KEYDIR[k] === 'right')) { e.preventDefault(); return; }

  if (KEYDIR[k]) { pressDir(KEYDIR[k]); e.preventDefault(); return; }
  if (k === 'z' || k === 'Z' || k === ' ' || k === 'j') {
    held.fast = true;
    if (state !== 'play' && state !== 'ready' && state !== 'pause') onAction();
    e.preventDefault(); return;
  }
  if (k === 'x' || k === 'X' || k === 'Shift' || k === 'k') {
    held.slow = true;
    if (state === 'title') openOptions();
    else if (state !== 'play' && state !== 'ready' && state !== 'pause') onAction();
    e.preventDefault(); return;
  }
  if (k === 'o' || k === 'O') { if (state === 'title') openOptions(); return; }
  if (k === 'Enter') { if (state !== 'play' && state !== 'ready' && state !== 'pause') onAction(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'play' || state === 'ready' || state === 'pause') togglePause();
    return;
  }
}
window.addEventListener('keydown', onKeyDown);
function onKeyUp(e) {
  const k = e.key;
  if (e.code && !KEYDIR[k]) { const d = p1Dir(e.code); if (d) { releaseDir(d); return; } if (PLAY_KEYS.f.includes(e.code)) held.fast = false; }
  if (KEYDIR[k]) { releaseDir(KEYDIR[k]); return; }
  if (k === 'z' || k === 'Z' || k === ' ' || k === 'j') held.fast = false;
  if (k === 'x' || k === 'X' || k === 'Shift' || k === 'k') held.slow = false;
}
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', () => { if (state === 'play' || state === 'ready') doPause(); });
// スマホでアプリやタブを切り替えたときも自動でポーズ(音も止める)
if (document.addEventListener) document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play' || state === 'ready') doPause(); else Bgm.pause(); }
  else if (state !== 'pause') Bgm.resume();
});

// スクリーンショット: いまの画面を PNG で保存
function saveShot() {
  if (!cv.toBlob) return false;
  const d = new Date(), name = 'nawabari-' + todayStr(d) + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + String(d.getSeconds()).padStart(2, '0') + '.png';
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  floats.push({ x: W / 2, y: FIELD_Y + 40, txt: 'SCREENSHOT!', t: 1.0, col: '#ffffff' });
  Snd.select();
  return true;
}

/* ---------------- ゲームパッド ----------------
   十字キー/左スティック=移動、A=速く引く・決定、B=OPTIONS・戻る、START=ポーズ。
   押された/離された瞬間にキーボードと同じ処理を呼ぶ */
const PAD_MAP = [[12, 'ArrowUp'], [13, 'ArrowDown'], [14, 'ArrowLeft'], [15, 'ArrowRight'], [0, 'z'], [1, 'x'], [9, 'p']];
function padKeys(gp) {
  const on = new Set(), b = i => gp.buttons[i] && gp.buttons[i].pressed;
  for (const [i, k] of PAD_MAP) if (b(i)) on.add(k);
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  if (Math.max(Math.abs(ax), Math.abs(ay)) > 0.5) on.add(Math.abs(ax) > Math.abs(ay) ? (ax > 0 ? 'ArrowRight' : 'ArrowLeft') : (ay > 0 ? 'ArrowDown' : 'ArrowUp'));
  return on;
}
let padPrev = new Set();
// 振動: スマホ(vibrate)とゲームパッド(ランブル)。「画面揺れ」OFFなら振動もしない
function buzz(ms, strong) {
  if (!settings.shake || typeof navigator === 'undefined') return false;
  if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return false;   // まだ一度も操作していない
  try {
    if (navigator.vibrate) navigator.vibrate(ms);
    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(g => g && g.vibrationActuator) : null;
    if (gp) gp.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong || 0.6, weakMagnitude: 0.4 });
  } catch (e) {}
  return true;
}
function pollPad() {
  if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
  const gp = [...navigator.getGamepads()].find(g => g && g.connected);
  const now = gp ? padKeys(gp) : new Set();
  const ev = key => ({ key, repeat: false, preventDefault() {} });
  for (const k of now) if (!padPrev.has(k)) { onKeyDown(ev(k)); }
  for (const k of padPrev) if (!now.has(k)) onKeyUp(ev(k));
  padPrev = now;
}

/* ---------------- タッチ操作 ---------------- */
function bindHold(id, down, up) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('pointerdown', e => { e.preventDefault(); Snd.ensure(); down(); });
  const rel = e => { e.preventDefault(); up(); };
  el.addEventListener('pointerup', rel);
  el.addEventListener('pointercancel', rel);
  el.addEventListener('pointerleave', rel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
// アナログスティック: 中心からのずれの向きで上下左右を決める。
// 真ん中あたり(半径の18%以内)は止まる。斜めのあたりで向きがぱたぱた変わらないよう、いまの向きを少しだけ優先する
function stickDir(dx, dy, cur, R) {
  if (Math.hypot(dx, dy) < R * 0.18) return null;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  let horiz = ax > ay;
  if (cur === 'left' || cur === 'right') horiz = ax * 1.3 > ay;
  else if (cur === 'up' || cur === 'down') horiz = ax > ay * 1.3;
  return horiz ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
}
const STICK_KEY = { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight' };
let stickCur = null;
function stickSet(d) {
  if (d === stickCur) return;
  if (stickCur) releaseDir(stickCur);
  stickCur = d;
  if (!d) return;
  buzz(8, 0.2);                      // 向きが変わったら、ごく短くブルッ
  if (state === 'title' && (d === 'left' || d === 'right')) return;
  // メニューでは矢印キーと同じように選べる
  if (['options', 'pause'].includes(state)) { onKeyDown({ key: STICK_KEY[d], repeat: false, preventDefault() {} }); return; }
  pressDir(d);
}
(function bindStick() {
  const st = document.getElementById('stick'), kn = document.getElementById('knob');
  if (!st || !st.addEventListener) return;
  let pid = null;
  const move = e => {
    const r = st.getBoundingClientRect(), R = r.width / 2 || 88;
    const dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R), L = Math.hypot(dx, dy), mx = R * 0.6, k = L > mx ? mx / L : 1;
    if (kn) kn.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
    stickVec = L >= R * 0.18 ? [dx / L, dy / L] : null;       // 平面ではこの向きにそのまま進む
    stickSet(stickDir(dx, dy, stickCur, R));
  };
  st.addEventListener('pointerdown', e => {
    e.preventDefault(); Snd.ensure(); pid = e.pointerId;
    try { st.setPointerCapture(pid); } catch (er) {}
    st.classList.add('on'); move(e);
  });
  st.addEventListener('pointermove', e => { if (e.pointerId === pid) { e.preventDefault(); move(e); } });
  const end = e => {
    if (e.pointerId !== pid) return;
    pid = null; st.classList.remove('on');
    if (kn) kn.style.transform = '';
    stickVec = null;
    stickSet(null);
  };
  st.addEventListener('pointerup', end);
  st.addEventListener('pointercancel', end);
  st.addEventListener('contextmenu', e => e.preventDefault());
})();
bindHold('b-view', () => { held.slow = true; }, () => { held.slow = false; });
bindHold('b-fast', () => {
  held.fast = true;
  if (state !== 'play' && state !== 'ready' && state !== 'pause' && state !== 'options') onAction();
}, () => { held.fast = false; });
// キャンバス上のタップを状態別に振り分け
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function inRect(p, r) { return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Snd.ensure();
  const p = canvasPos(e);

  if (state === 'title') {
    if (inRect(p, titleOptRect)) openOptions();
    else onAction();                                  // 準備画面へ
    return;
  }
  if (state === 'vssetup') { vsSetTap(p); return; }
  if (state === 'matchopts') { const r = matchRects.find(q => inRect(p, q)); if (r) { matchSel = r.idx; matchAdjust(p.x < W / 2 ? -1 : 1); } else { setState(matchFrom); Snd.select(); } return; }
  if (state === 'keycfg') { const r = keyRects.find(q => inRect(p, q)); if (r) { keySel = [r.i, r.j]; keyWait = true; Snd.select(); } else { setState('matchopts'); Snd.select(); } return; }
  if (state === 'achv' || state === 'stats') { setState('options'); Snd.select(); return; }
  if (state === 'gallery') {
    const r = galRects.find(q => inRect(p, q));
    if (galleryBig) galleryBig = false;
    else if (r) { gallerySel = r.idx; galleryBig = true; }
    else setState(galleryFrom);
    Snd.select(); return;
  }
  if (state === 'help') { closeHelp(); return; }
  if (state === 'options') {
    const row = optRects.find(r => inRect(p, r));
    if (!row) return;
    optSel = row.idx;
    if (OPT_ITEMS[optSel].k === '_back') { closeOptions(); return; }
    adjustOpt(p.x < W / 2 ? -1 : 1); // 行の左半分で−、右半分で+
    return;
  }
  if (state === 'play' || state === 'ready') {
    if (inRect(p, pauseRect)) { doPause(); pauseSel = 0; return; }
    dragStart = p; dragDir = null;            // なぞり操作の開始
    return;
  }
  if (state === 'pause') {
    const row = pauseRects.find(r => inRect(p, r));
    if (row) pauseChoose(row.idx);
    return;
  }
  if (isResult()) {
    if (stTimer > 1.0 && canLapse() && inRect(p, lapseBtn)) { startLapse(); return; }
    if (stTimer > 1.0 && !lapsePlay && inRect(p, viewBtn)) { resHide = !resHide; Snd.select(); return; }
    resPtrs.set(e.pointerId, p);
    if (resPtrs.size === 2) { const [a, b] = [...resPtrs.values()]; resPinch = Math.hypot(a.x - b.x, a.y - b.y); resDrag = null; return; }
    resDrag = { x: p.x, y: p.y, moved: false };          // 動かさずに離したら「次へ」、動かしたら回す
    return;
  }
  onAction(); // over
});
cv.addEventListener('pointermove', e => {
  if (!isResult()) return;
  const p = canvasPos(e);
  if (resPtrs.has(e.pointerId)) resPtrs.set(e.pointerId, p);
  if (resPtrs.size === 2) {                           // ピンチで拡大縮小
    const [a, b] = [...resPtrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (resPinch > 0) resZoom = clamp(resZoom * resPinch / Math.max(20, d), 2.6, 9);
    resPinch = d; resIdle = 0; return;
  }
  if (!resDrag) return;
  const dx = p.x - resDrag.x, dy = p.y - resDrag.y;
  if (!resDrag.moved && Math.hypot(dx, dy) < 8) return;
  resDrag.moved = true; resIdle = 0;
  if (surf.is3D) { camRotate([0, 1, 0], dx * 0.008); camRotate([1, 0, 0], dy * 0.008); }
  resDrag.x = p.x; resDrag.y = p.y;
});
function endResDrag(e) {
  if (e && resPtrs.has(e.pointerId)) resPtrs.delete(e.pointerId);
  if (resPtrs.size < 2) resPinch = 0;
  if (!resDrag) return;
  const tap = !resDrag.moved;
  resDrag = null;
  if (tap && lapsePlay) { endLapse(false); return; }  // タイムラプス中: 動かさずに離したらとめる(ドラッグは回す)
  if (tap && isResult()) onAction();                  // タップ = 次へ
}
window.addEventListener('pointerup', endResDrag);
window.addEventListener('pointercancel', e => { if (e && resPtrs.has(e.pointerId)) resPtrs.delete(e.pointerId); resDrag = null; });
cv.addEventListener('wheel', e => {
  if (!isResult() || !surf.is3D) return;
  resZoom = clamp(resZoom * (1 + e.deltaY * 0.0012), 2.6, 9); resIdle = 0;
  if (e.preventDefault) e.preventDefault();
}, { passive: false });

// 画面をなぞって方向を指示する(指・マウス)。離すと止まる
let dragStart = null, dragDir = null;
function dirFromDrag(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
cv.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const p = canvasPos(e), dx = p.x - dragStart.x, dy = p.y - dragStart.y;
  if (Math.hypot(dx, dy) < 16) return;
  const d = dirFromDrag(dx, dy);
  if (d !== dragDir) { if (dragDir) releaseDir(dragDir); pressDir(d); dragDir = d; }
  dragStart = p;                               // 途中で向きを変えられるよう基準を更新
});
function endDrag() { if (dragDir) releaseDir(dragDir); dragStart = null; dragDir = null; }
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* ---------------- 画面サイズ調整 ---------------- */
function isLandscapeTouch() {
  try { return window.matchMedia('(pointer:coarse) and (orientation:landscape)').matches; } catch (e) { return false; }
}
function fitCanvas() {
  const pad = document.getElementById('pad');
  let s;
  if (isLandscapeTouch()) {
    // 横向き: 左右のパッドの幅を引いた残りに収める
    const dw = (document.getElementById('dpad').offsetWidth || 180) + (document.getElementById('acts').offsetWidth || 90) + 44;
    s = Math.min((window.innerWidth - dw) / W, (window.innerHeight - 8) / H);
  } else {
    const padH = (getComputedStyle(pad).display !== 'none') ? pad.offsetHeight + 8 : 0;
    s = Math.min((window.innerWidth - 8) / W, (window.innerHeight - padH - 12) / H);
  }
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);

/* ---------------- 起動 ---------------- */
applyTheme();
applyCrt();
initLevel(1);
Bgm.play('title'); // 最初の操作でAudioContextが起きたら鳴り始める
fitCanvas();
requestAnimationFrame(loop);
</script>
</body>
